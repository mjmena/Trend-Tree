schema: workflow/2022.04
name: Distillation Revisit
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 750
triggers:
- id: dc_RWu7L4x
- id: dc_nvuXjy0
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: respond_accepted
  runtime: nodejs20.x
  uses: "./respond_accepted/entry.mjs"
  props:
    event: "{{steps.normalize_event.$return_value}}"
- namespace: prepare_chain
  runtime: nodejs20.x
  uses: "./prepare_chain/entry.mjs"
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    event: "{{steps.normalize_event.$return_value}}"
- namespace: select_next_batch
  runtime: nodejs20.x
  uses: "./select_next_batch/entry.mjs"
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    event: "{{steps.normalize_event.$return_value}}"
    prepare_result: "{{steps.prepare_chain.$return_value}}"
- namespace: dispatch_to_cluster_agent
  runtime: nodejs20.x
  uses: "./dispatch_to_cluster_agent/entry.js"
  props:
    cluster_agent_url: https://eoo8hdm25do049f.m.pipedream.net
    next_batch: "{{steps.select_next_batch.$return_value}}"
- namespace: parse_cluster_result
  runtime: nodejs20.x
  uses: "./parse_cluster_result/entry.mjs"
  props:
    resume_payload: "{{steps.dispatch_to_cluster_agent.$resume_data}}"
    dispatch_meta: "{{steps.dispatch_to_cluster_agent.$return_value}}"
- namespace: commit_batch_result
  runtime: nodejs20.x
  uses: "./commit_batch_result/entry.mjs"
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    parsed: "{{steps.parse_cluster_result.$return_value}}"
- namespace: finalize_or_continue
  runtime: nodejs20.x
  uses: "./finalize_or_continue/entry.mjs"
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    lead_http_url: https://1b41cb63d2c089e4360ad1b177b35be9.m.pipedream.net
    event: "{{steps.normalize_event.$return_value}}"

