schema: workflow/2022.04
name: Distillation
settings:
  error_notification: true
  lambda_memory: 8192
  lambda_timeout: 750
triggers:
- id: hi_wWH723X
- id: dc_QyuK1JR
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: respond_accepted
  runtime: nodejs20.x
  uses: "./respond_accepted/entry.mjs"
  props:
    event: "{{steps.normalize_event.$return_value}}"
- namespace: q_load_cursor
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS,
               COALESCE(LAST_SIGNAL_TS, DATEADD(hour, -2, CURRENT_TIMESTAMP())) AS WINDOW_START_TS
        FROM MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR
        WHERE CURSOR_NAME = '{{steps.normalize_event.$return_value.cursor_name}}'
      query: |-
        SELECT CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS,
               COALESCE(LAST_SIGNAL_TS, DATEADD(hour, -2, CURRENT_TIMESTAMP())) AS WINDOW_START_TS
        FROM MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR
        WHERE CURSOR_NAME = '{{steps.normalize_event.$return_value.cursor_name}}'
      params: []
- namespace: q_release_stale_claims
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: CALL MCC_RAW.MARKETING_DEV.PROC_RELEASE_STALE_SIGNAL_CLAIMS()
      query: CALL MCC_RAW.MARKETING_DEV.PROC_RELEASE_STALE_SIGNAL_CLAIMS()
      params: []
- namespace: acquire_signal_ids
  runtime: nodejs20.x
  uses: "./acquire_signal_ids/entry.js"
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
- namespace: q_cluster_signals
  runtime: nodejs20.x
  uses: "./q_cluster_signals/entry.js"
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    signal_ids_json: "{{steps.acquire_signal_ids.$return_value.signal_ids_json}}"
- namespace: claim_window_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS s
        SET AGENT_SESSION_ID = '{{steps.normalize_event.$return_value.agent_session_id}}'
        WHERE s.AGENT_SESSION_ID IS NULL
          AND s.SIGNAL_ID IN (
            SELECT VALUE::STRING FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1)))
          )
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS s
        SET AGENT_SESSION_ID = '{{steps.normalize_event.$return_value.agent_session_id}}'
        WHERE s.AGENT_SESSION_ID IS NULL
          AND s.SIGNAL_ID IN (
            SELECT VALUE::STRING FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1)))
          )
      params:
      - "{{steps.acquire_signal_ids.$return_value.signal_ids_json}}"
- namespace: dispatch_to_cluster_agent
  runtime: nodejs20.x
  uses: "./dispatch_to_cluster_agent/entry.js"
  props:
    cluster_agent_url: https://eoo8hdm25do049f.m.pipedream.net
    cluster_rows: "{{steps.q_cluster_signals.$return_value}}"
    signal_ids_json: "{{steps.acquire_signal_ids.$return_value.signal_ids_json}}"
    agent_session_id: "{{steps.normalize_event.$return_value.agent_session_id}}"
    chain_id: "{{steps.normalize_event.$return_value.chain_id}}"
- namespace: parse_cluster_result
  runtime: nodejs20.x
  uses: "./parse_cluster_result/entry.mjs"
  props:
    resume_payload: "{{steps.dispatch_to_cluster_agent.$resume_data}}"
    dispatch_meta: "{{steps.dispatch_to_cluster_agent.$return_value}}"
- namespace: commit_candidates
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES (
          CANDIDATE_ID, AGENT_SESSION_ID, CHAIN_ID, ITERATION,
          TOPIC, SUPPORTING_SIGNAL_IDS, CONFIDENCE, SPECIFICITY_SCORE,
          SOURCE_BREAKDOWN, BUCKET, VERDICT, EVIDENCE_ADDED,
          REASONING, REASONING_TRACE, DEDUP_OF_TREND_ID
        )
        WITH cand AS (
          SELECT c.value AS j FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) c
        ),
        valid_pairs AS (
          SELECT DISTINCT
            cand.j:candidate_id::STRING AS candidate_id,
            f.SIGNAL_ID,
            f.SOURCE_NAME
          FROM cand, LATERAL FLATTEN(INPUT => cand.j:supporting_signal_ids) sid
          JOIN MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS f
            ON f.SIGNAL_ID = sid.value::STRING
        ),
        vs AS (
          SELECT candidate_id,
                 ARRAY_AGG(SIGNAL_ID) WITHIN GROUP (ORDER BY SIGNAL_ID) AS supporting_signal_ids
          FROM valid_pairs GROUP BY 1
        ),
        src_counts AS (
          SELECT candidate_id, SOURCE_NAME, COUNT(*) AS n
          FROM valid_pairs GROUP BY 1, 2
        ),
        sb AS (
          SELECT candidate_id, OBJECT_AGG(SOURCE_NAME, n::VARIANT) AS source_breakdown
          FROM src_counts GROUP BY 1
        )
        SELECT
          cand.j:candidate_id::STRING,
          cand.j:agent_session_id::STRING,
          cand.j:chain_id::STRING,
          cand.j:iteration::NUMBER,
          cand.j:topic::STRING,
          COALESCE(vs.supporting_signal_ids, ARRAY_CONSTRUCT()),
          cand.j:confidence::FLOAT,
          cand.j:specificity_score::FLOAT,
          COALESCE(sb.source_breakdown, OBJECT_CONSTRUCT()),
          cand.j:bucket::STRING,
          cand.j:verdict::STRING,
          cand.j:evidence_added,
          cand.j:reasoning::STRING,
          cand.j:reasoning_trace,
          cand.j:dedup_of_trend_id::STRING
        FROM cand
        LEFT JOIN vs ON vs.candidate_id = cand.j:candidate_id::STRING
        LEFT JOIN sb ON sb.candidate_id = cand.j:candidate_id::STRING
        WHERE :1 != '[]'
      query: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES (
          CANDIDATE_ID, AGENT_SESSION_ID, CHAIN_ID, ITERATION,
          TOPIC, SUPPORTING_SIGNAL_IDS, CONFIDENCE, SPECIFICITY_SCORE,
          SOURCE_BREAKDOWN, BUCKET, VERDICT, EVIDENCE_ADDED,
          REASONING, REASONING_TRACE, DEDUP_OF_TREND_ID
        )
        WITH cand AS (
          SELECT c.value AS j FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) c
        ),
        valid_pairs AS (
          SELECT DISTINCT
            cand.j:candidate_id::STRING AS candidate_id,
            f.SIGNAL_ID,
            f.SOURCE_NAME
          FROM cand, LATERAL FLATTEN(INPUT => cand.j:supporting_signal_ids) sid
          JOIN MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS f
            ON f.SIGNAL_ID = sid.value::STRING
        ),
        vs AS (
          SELECT candidate_id,
                 ARRAY_AGG(SIGNAL_ID) WITHIN GROUP (ORDER BY SIGNAL_ID) AS supporting_signal_ids
          FROM valid_pairs GROUP BY 1
        ),
        src_counts AS (
          SELECT candidate_id, SOURCE_NAME, COUNT(*) AS n
          FROM valid_pairs GROUP BY 1, 2
        ),
        sb AS (
          SELECT candidate_id, OBJECT_AGG(SOURCE_NAME, n::VARIANT) AS source_breakdown
          FROM src_counts GROUP BY 1
        )
        SELECT
          cand.j:candidate_id::STRING,
          cand.j:agent_session_id::STRING,
          cand.j:chain_id::STRING,
          cand.j:iteration::NUMBER,
          cand.j:topic::STRING,
          COALESCE(vs.supporting_signal_ids, ARRAY_CONSTRUCT()),
          cand.j:confidence::FLOAT,
          cand.j:specificity_score::FLOAT,
          COALESCE(sb.source_breakdown, OBJECT_CONSTRUCT()),
          cand.j:bucket::STRING,
          cand.j:verdict::STRING,
          cand.j:evidence_added,
          cand.j:reasoning::STRING,
          cand.j:reasoning_trace,
          cand.j:dedup_of_trend_id::STRING
        FROM cand
        LEFT JOIN vs ON vs.candidate_id = cand.j:candidate_id::STRING
        LEFT JOIN sb ON sb.candidate_id = cand.j:candidate_id::STRING
        WHERE :1 != '[]'
      params:
      - "{{steps.parse_cluster_result.$return_value.candidates_json}}"
- namespace: update_cursor
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR target
        USING (
          SELECT
            '{{steps.normalize_event.$return_value.cursor_name}}'::STRING AS CURSOR_NAME,
            CURRENT_TIMESTAMP()::TIMESTAMP_NTZ                            AS LAST_RUN_AT,
            TRY_TO_TIMESTAMP_NTZ('{{steps.parse_cluster_result.$return_value.max_signal_ts}}') AS LAST_SIGNAL_TS,
            {{steps.parse_cluster_result.$return_value.run_duration_ms}}::NUMBER AS RUN_DURATION_MS,
            {{steps.parse_cluster_result.$return_value.signals_seen}}::NUMBER    AS SIGNAL_COUNT,
            {{steps.parse_cluster_result.$return_value.candidates_count}}::NUMBER AS CANDIDATE_COUNT,
            {{steps.parse_cluster_result.$return_value.cost_usd}}::FLOAT          AS COST_USD
        ) source
        ON target.CURSOR_NAME = source.CURSOR_NAME
        WHEN MATCHED THEN UPDATE SET
          target.LAST_RUN_AT      = source.LAST_RUN_AT,
          target.LAST_SIGNAL_TS   = COALESCE(source.LAST_SIGNAL_TS, target.LAST_SIGNAL_TS),
          target.RUN_DURATION_MS  = source.RUN_DURATION_MS,
          target.SIGNAL_COUNT     = source.SIGNAL_COUNT,
          target.CANDIDATE_COUNT  = source.CANDIDATE_COUNT,
          target.COST_USD         = source.COST_USD
        WHEN NOT MATCHED THEN INSERT (
          CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS, RUN_DURATION_MS, SIGNAL_COUNT, CANDIDATE_COUNT, COST_USD
        ) VALUES (
          source.CURSOR_NAME, source.LAST_RUN_AT, source.LAST_SIGNAL_TS,
          source.RUN_DURATION_MS, source.SIGNAL_COUNT, source.CANDIDATE_COUNT, source.COST_USD
        )
      query: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR target
        USING (
          SELECT
            '{{steps.normalize_event.$return_value.cursor_name}}'::STRING AS CURSOR_NAME,
            CURRENT_TIMESTAMP()::TIMESTAMP_NTZ                            AS LAST_RUN_AT,
            TRY_TO_TIMESTAMP_NTZ('{{steps.parse_cluster_result.$return_value.max_signal_ts}}') AS LAST_SIGNAL_TS,
            {{steps.parse_cluster_result.$return_value.run_duration_ms}}::NUMBER AS RUN_DURATION_MS,
            {{steps.parse_cluster_result.$return_value.signals_seen}}::NUMBER    AS SIGNAL_COUNT,
            {{steps.parse_cluster_result.$return_value.candidates_count}}::NUMBER AS CANDIDATE_COUNT,
            {{steps.parse_cluster_result.$return_value.cost_usd}}::FLOAT          AS COST_USD
        ) source
        ON target.CURSOR_NAME = source.CURSOR_NAME
        WHEN MATCHED THEN UPDATE SET
          target.LAST_RUN_AT      = source.LAST_RUN_AT,
          target.LAST_SIGNAL_TS   = COALESCE(source.LAST_SIGNAL_TS, target.LAST_SIGNAL_TS),
          target.RUN_DURATION_MS  = source.RUN_DURATION_MS,
          target.SIGNAL_COUNT     = source.SIGNAL_COUNT,
          target.CANDIDATE_COUNT  = source.CANDIDATE_COUNT,
          target.COST_USD         = source.COST_USD
        WHEN NOT MATCHED THEN INSERT (
          CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS, RUN_DURATION_MS, SIGNAL_COUNT, CANDIDATE_COUNT, COST_USD
        ) VALUES (
          source.CURSOR_NAME, source.LAST_RUN_AT, source.LAST_SIGNAL_TS,
          source.RUN_DURATION_MS, source.SIGNAL_COUNT, source.CANDIDATE_COUNT, source.COST_USD
        )
      params: []
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    agent_result: "{{steps.parse_cluster_result.$return_value}}"
    commit_result: "{{steps.commit_candidates.$return_value}}"
    claim_signals_result: "{{steps.claim_window_signals.$return_value}}"

