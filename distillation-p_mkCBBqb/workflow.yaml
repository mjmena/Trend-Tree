schema: workflow/2022.04
name: Distillation
settings:
  error_notification: true
  lambda_memory: 8192
  lambda_timeout: 750
  network: net_5Lnie3
triggers:
- id: hi_wWH723X
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_load_cursor
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS,
               COALESCE(LAST_SIGNAL_TS, DATEADD(hour, -2, CURRENT_TIMESTAMP())) AS WINDOW_START_TS
        FROM MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR
        WHERE CURSOR_NAME = '{{steps.normalize_event.$return_value.cursor_name}}'
      query: |-
        SELECT CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS,
               COALESCE(LAST_SIGNAL_TS, DATEADD(hour, -2, CURRENT_TIMESTAMP())) AS WINDOW_START_TS
        FROM MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR
        WHERE CURSOR_NAME = '{{steps.normalize_event.$return_value.cursor_name}}'
      params: []
- namespace: q_signals_window
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 800) AS SIGNAL_TEXT,
               METADATA
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_TIMESTAMP > '{{steps.q_load_cursor.$return_value.[0].WINDOW_START_TS}}'
          AND COALESCE(AGENT_SESSION_ID, '') = ''
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 600
      query: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 800) AS SIGNAL_TEXT,
               METADATA
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_TIMESTAMP > '{{steps.q_load_cursor.$return_value.[0].WINDOW_START_TS}}'
          AND COALESCE(AGENT_SESSION_ID, '') = ''
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 600
      params: []
- namespace: q_louvain_candidates
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT
          m.TREND_ID                                           AS CLUSTER_ID,
          m.TREND_TOPIC                                        AS CENTROID_TOPIC,
          m.TOTAL_CLUSTER_SIZE                                 AS SIGNAL_COUNT,
          m.DISTINCT_SOURCE_COUNT,
          m.VELOCITY_DIRECTION,
          m.TREND_HEAT_INDEX,
          m.DETECTED_AT,
          ARRAY_AGG(s.INGESTION_ID) WITHIN GROUP (ORDER BY s.PAGERANK_SCORE DESC NULLS LAST) AS SIGNAL_IDS,
          ARRAY_AGG(DISTINCT s.DOMAIN)                         AS TOP_DOMAINS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s ON s.TREND_ID = m.TREND_ID
        WHERE m.DETECTED_AT > '{{steps.q_load_cursor.$return_value.[0].WINDOW_START_TS}}'
          AND m.VELOCITY_DIRECTION != 'SUPERSEDED'
        GROUP BY 1, 2, 3, 4, 5, 6, 7
        ORDER BY m.DETECTED_AT DESC NULLS LAST
        LIMIT 200
      query: |-
        SELECT
          m.TREND_ID                                           AS CLUSTER_ID,
          m.TREND_TOPIC                                        AS CENTROID_TOPIC,
          m.TOTAL_CLUSTER_SIZE                                 AS SIGNAL_COUNT,
          m.DISTINCT_SOURCE_COUNT,
          m.VELOCITY_DIRECTION,
          m.TREND_HEAT_INDEX,
          m.DETECTED_AT,
          ARRAY_AGG(s.INGESTION_ID) WITHIN GROUP (ORDER BY s.PAGERANK_SCORE DESC NULLS LAST) AS SIGNAL_IDS,
          ARRAY_AGG(DISTINCT s.DOMAIN)                         AS TOP_DOMAINS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s ON s.TREND_ID = m.TREND_ID
        WHERE m.DETECTED_AT > '{{steps.q_load_cursor.$return_value.[0].WINDOW_START_TS}}'
          AND m.VELOCITY_DIRECTION != 'SUPERSEDED'
        GROUP BY 1, 2, 3, 4, 5, 6, 7
        ORDER BY m.DETECTED_AT DESC NULLS LAST
        LIMIT 200
      params: []
- namespace: q_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT m.TREND_ID, m.TREND_TOPIC, m.TOTAL_CLUSTER_SIZE,
               m.DISTINCT_SOURCE_COUNT, m.VELOCITY_DIRECTION,
               m.TREND_HEAT_INDEX, m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        WHERE m.VELOCITY_DIRECTION != 'SUPERSEDED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY m.TREND_HEAT_INDEX DESC NULLS LAST
        LIMIT 200
      query: |-
        SELECT m.TREND_ID, m.TREND_TOPIC, m.TOTAL_CLUSTER_SIZE,
               m.DISTINCT_SOURCE_COUNT, m.VELOCITY_DIRECTION,
               m.TREND_HEAT_INDEX, m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        WHERE m.VELOCITY_DIRECTION != 'SUPERSEDED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY m.TREND_HEAT_INDEX DESC NULLS LAST
        LIMIT 200
      params: []
- namespace: run_lead_agent
  runtime: nodejs20.x
  uses: "./run_lead_agent/entry.js"
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    event: "{{steps.normalize_event.$return_value}}"
    cursor_rows: "{{steps.q_load_cursor.$return_value}}"
    signal_rows: "{{steps.q_signals_window.$return_value}}"
    louvain_rows: "{{steps.q_louvain_candidates.$return_value}}"
    neighbor_rows: "{{steps.q_neighbors.$return_value}}"
    subagent_url: "https://eo5h5le4j2qu3tm.m.pipedream.net"
    bluesky_url: "https://eoydyalz1dslfre.m.pipedream.net"
    gdelt_url: "https://eoovhehfk229jrg.m.pipedream.net"
    gtrends_url: "https://eov9u8rngcgi2z6.m.pipedream.net"
    grok_url: "https://eovzc5ljf76h3h6.m.pipedream.net"
- namespace: commit_candidates
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES_AGENT (
          CANDIDATE_ID, AGENT_SESSION_ID, CHAIN_ID, ITERATION,
          TOPIC, SUPPORTING_SIGNAL_IDS, CONFIDENCE, SPECIFICITY_SCORE,
          SOURCE_BREAKDOWN, BUCKET, VERDICT, EVIDENCE_ADDED,
          REASONING, REASONING_TRACE, DEDUP_OF_TREND_ID
        )
        SELECT
          c.value:candidate_id::STRING,
          c.value:agent_session_id::STRING,
          c.value:chain_id::STRING,
          c.value:iteration::NUMBER,
          c.value:topic::STRING,
          c.value:supporting_signal_ids,
          c.value:confidence::FLOAT,
          c.value:specificity_score::FLOAT,
          c.value:source_breakdown,
          c.value:bucket::STRING,
          c.value:verdict::STRING,
          c.value:evidence_added,
          c.value:reasoning::STRING,
          c.value:reasoning_trace,
          c.value:dedup_of_trend_id::STRING
        FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) c
        WHERE :1 != '[]'
      query: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES_AGENT (
          CANDIDATE_ID, AGENT_SESSION_ID, CHAIN_ID, ITERATION,
          TOPIC, SUPPORTING_SIGNAL_IDS, CONFIDENCE, SPECIFICITY_SCORE,
          SOURCE_BREAKDOWN, BUCKET, VERDICT, EVIDENCE_ADDED,
          REASONING, REASONING_TRACE, DEDUP_OF_TREND_ID
        )
        SELECT
          c.value:candidate_id::STRING,
          c.value:agent_session_id::STRING,
          c.value:chain_id::STRING,
          c.value:iteration::NUMBER,
          c.value:topic::STRING,
          c.value:supporting_signal_ids,
          c.value:confidence::FLOAT,
          c.value:specificity_score::FLOAT,
          c.value:source_breakdown,
          c.value:bucket::STRING,
          c.value:verdict::STRING,
          c.value:evidence_added,
          c.value:reasoning::STRING,
          c.value:reasoning_trace,
          c.value:dedup_of_trend_id::STRING
        FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) c
        WHERE :1 != '[]'
      params:
      - "{{steps.run_lead_agent.$return_value.candidates_json}}"
- namespace: update_cursor
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR target
        USING (
          SELECT
            '{{steps.normalize_event.$return_value.cursor_name}}'::STRING AS CURSOR_NAME,
            CURRENT_TIMESTAMP()::TIMESTAMP_NTZ                            AS LAST_RUN_AT,
            TRY_TO_TIMESTAMP_NTZ('{{steps.run_lead_agent.$return_value.max_signal_ts}}') AS LAST_SIGNAL_TS,
            {{steps.run_lead_agent.$return_value.run_duration_ms}}::NUMBER AS RUN_DURATION_MS,
            {{steps.run_lead_agent.$return_value.signals_seen}}::NUMBER    AS SIGNAL_COUNT,
            {{steps.run_lead_agent.$return_value.candidates_count}}::NUMBER AS CANDIDATE_COUNT,
            {{steps.run_lead_agent.$return_value.cost_usd}}::FLOAT          AS COST_USD
        ) source
        ON target.CURSOR_NAME = source.CURSOR_NAME
        WHEN MATCHED THEN UPDATE SET
          target.LAST_RUN_AT      = source.LAST_RUN_AT,
          target.LAST_SIGNAL_TS   = COALESCE(source.LAST_SIGNAL_TS, target.LAST_SIGNAL_TS),
          target.RUN_DURATION_MS  = source.RUN_DURATION_MS,
          target.SIGNAL_COUNT     = source.SIGNAL_COUNT,
          target.CANDIDATE_COUNT  = source.CANDIDATE_COUNT,
          target.COST_USD         = source.COST_USD
        WHEN NOT MATCHED THEN INSERT (
          CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS, RUN_DURATION_MS, SIGNAL_COUNT, CANDIDATE_COUNT, COST_USD
        ) VALUES (
          source.CURSOR_NAME, source.LAST_RUN_AT, source.LAST_SIGNAL_TS,
          source.RUN_DURATION_MS, source.SIGNAL_COUNT, source.CANDIDATE_COUNT, source.COST_USD
        )
      query: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR target
        USING (
          SELECT
            '{{steps.normalize_event.$return_value.cursor_name}}'::STRING AS CURSOR_NAME,
            CURRENT_TIMESTAMP()::TIMESTAMP_NTZ                            AS LAST_RUN_AT,
            TRY_TO_TIMESTAMP_NTZ('{{steps.run_lead_agent.$return_value.max_signal_ts}}') AS LAST_SIGNAL_TS,
            {{steps.run_lead_agent.$return_value.run_duration_ms}}::NUMBER AS RUN_DURATION_MS,
            {{steps.run_lead_agent.$return_value.signals_seen}}::NUMBER    AS SIGNAL_COUNT,
            {{steps.run_lead_agent.$return_value.candidates_count}}::NUMBER AS CANDIDATE_COUNT,
            {{steps.run_lead_agent.$return_value.cost_usd}}::FLOAT          AS COST_USD
        ) source
        ON target.CURSOR_NAME = source.CURSOR_NAME
        WHEN MATCHED THEN UPDATE SET
          target.LAST_RUN_AT      = source.LAST_RUN_AT,
          target.LAST_SIGNAL_TS   = COALESCE(source.LAST_SIGNAL_TS, target.LAST_SIGNAL_TS),
          target.RUN_DURATION_MS  = source.RUN_DURATION_MS,
          target.SIGNAL_COUNT     = source.SIGNAL_COUNT,
          target.CANDIDATE_COUNT  = source.CANDIDATE_COUNT,
          target.COST_USD         = source.COST_USD
        WHEN NOT MATCHED THEN INSERT (
          CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS, RUN_DURATION_MS, SIGNAL_COUNT, CANDIDATE_COUNT, COST_USD
        ) VALUES (
          source.CURSOR_NAME, source.LAST_RUN_AT, source.LAST_SIGNAL_TS,
          source.RUN_DURATION_MS, source.SIGNAL_COUNT, source.CANDIDATE_COUNT, source.COST_USD
        )
      params: []
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    agent_result: "{{steps.run_lead_agent.$return_value}}"
    commit_result: "{{steps.commit_candidates.$return_value}}"

