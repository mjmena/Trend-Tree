schema: workflow/2022.04
name: Distillation
settings:
  error_notification: true
  lambda_memory: 8192
  lambda_timeout: 750
  network: net_5Lnie3
triggers:
- id: hi_wWH723X
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_load_cursor
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS,
               COALESCE(LAST_SIGNAL_TS, DATEADD(hour, -2, CURRENT_TIMESTAMP())) AS WINDOW_START_TS
        FROM MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR
        WHERE CURSOR_NAME = '{{steps.normalize_event.$return_value.cursor_name}}'
      query: |-
        SELECT CURSOR_NAME, LAST_RUN_AT, LAST_SIGNAL_TS,
               COALESCE(LAST_SIGNAL_TS, DATEADD(hour, -2, CURRENT_TIMESTAMP())) AS WINDOW_START_TS
        FROM MCC_RAW.MARKETING_DEV.STG_DISTILLATION_CURSOR
        WHERE CURSOR_NAME = '{{steps.normalize_event.$return_value.cursor_name}}'
      params: []
- namespace: q_signals_window
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 800) AS SIGNAL_TEXT,
               METADATA
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_TIMESTAMP > DATEADD(hour, -24, CURRENT_TIMESTAMP())
          AND COALESCE(AGENT_SESSION_ID, '') = ''
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 600
      query: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 800) AS SIGNAL_TEXT,
               METADATA
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_TIMESTAMP > DATEADD(hour, -24, CURRENT_TIMESTAMP())
          AND COALESCE(AGENT_SESSION_ID, '') = ''
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 600
      params: []
- namespace: q_louvain_candidates
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT
          m.TREND_ID                                           AS CLUSTER_ID,
          m.TREND_TOPIC                                        AS CENTROID_TOPIC,
          m.TOTAL_CLUSTER_SIZE                                 AS SIGNAL_COUNT,
          m.DISTINCT_SOURCE_COUNT,
          m.VELOCITY_DIRECTION,
          m.TREND_HEAT_INDEX,
          m.DETECTED_AT,
          ARRAY_AGG(s.INGESTION_ID) WITHIN GROUP (ORDER BY s.PAGERANK_SCORE DESC NULLS LAST) AS SIGNAL_IDS,
          ARRAY_AGG(DISTINCT s.DOMAIN)                         AS TOP_DOMAINS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s ON s.TREND_ID = m.TREND_ID
        WHERE m.DETECTED_AT > '{{steps.q_load_cursor.$return_value.[0].WINDOW_START_TS}}'
          AND m.VELOCITY_DIRECTION != 'SUPERSEDED'
        GROUP BY 1, 2, 3, 4, 5, 6, 7
        ORDER BY m.DETECTED_AT DESC NULLS LAST
        LIMIT 200
      query: |-
        SELECT
          m.TREND_ID                                           AS CLUSTER_ID,
          m.TREND_TOPIC                                        AS CENTROID_TOPIC,
          m.TOTAL_CLUSTER_SIZE                                 AS SIGNAL_COUNT,
          m.DISTINCT_SOURCE_COUNT,
          m.VELOCITY_DIRECTION,
          m.TREND_HEAT_INDEX,
          m.DETECTED_AT,
          ARRAY_AGG(s.INGESTION_ID) WITHIN GROUP (ORDER BY s.PAGERANK_SCORE DESC NULLS LAST) AS SIGNAL_IDS,
          ARRAY_AGG(DISTINCT s.DOMAIN)                         AS TOP_DOMAINS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s ON s.TREND_ID = m.TREND_ID
        WHERE m.DETECTED_AT > '{{steps.q_load_cursor.$return_value.[0].WINDOW_START_TS}}'
          AND m.VELOCITY_DIRECTION != 'SUPERSEDED'
        GROUP BY 1, 2, 3, 4, 5, 6, 7
        ORDER BY m.DETECTED_AT DESC NULLS LAST
        LIMIT 200
      params: []
- namespace: q_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT m.TREND_ID, m.TREND_TOPIC, m.TOTAL_CLUSTER_SIZE,
               m.DISTINCT_SOURCE_COUNT, m.VELOCITY_DIRECTION,
               m.TREND_HEAT_INDEX, m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS m
        WHERE COALESCE(m.VELOCITY_DIRECTION, '') != 'SUPERSEDED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY m.LAST_UPDATE_AT DESC NULLS LAST
        LIMIT 200
      query: |-
        SELECT m.TREND_ID, m.TREND_TOPIC, m.TOTAL_CLUSTER_SIZE,
               m.DISTINCT_SOURCE_COUNT, m.VELOCITY_DIRECTION,
               m.TREND_HEAT_INDEX, m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS m
        WHERE COALESCE(m.VELOCITY_DIRECTION, '') != 'SUPERSEDED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY m.LAST_UPDATE_AT DESC NULLS LAST
        LIMIT 200
      params: []
