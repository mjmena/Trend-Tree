- namespace: commit_candidates
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES (
          CANDIDATE_ID, AGENT_SESSION_ID, CHAIN_ID, ITERATION,
          TOPIC, SUPPORTING_SIGNAL_IDS, CONFIDENCE, SPECIFICITY_SCORE,
          SOURCE_BREAKDOWN, BUCKET, VERDICT, EVIDENCE_ADDED,
          REASONING, REASONING_TRACE, DEDUP_OF_TREND_ID
        )
        SELECT
          c.value:candidate_id::STRING,
          c.value:agent_session_id::STRING,
          c.value:chain_id::STRING,
          c.value:iteration::NUMBER,
          c.value:topic::STRING,
          c.value:supporting_signal_ids,
          c.value:confidence::FLOAT,
          c.value:specificity_score::FLOAT,
          c.value:source_breakdown,
          c.value:bucket::STRING,
          c.value:verdict::STRING,
          c.value:evidence_added,
          c.value:reasoning::STRING,
          c.value:reasoning_trace,
          c.value:dedup_of_trend_id::STRING
        FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) c
        WHERE :1 != '[]'
      query: |-
        INSERT INTO MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES (
          CANDIDATE_ID, AGENT_SESSION_ID, CHAIN_ID, ITERATION,
          TOPIC, SUPPORTING_SIGNAL_IDS, CONFIDENCE, SPECIFICITY_SCORE,
          SOURCE_BREAKDOWN, BUCKET, VERDICT, EVIDENCE_ADDED,
          REASONING, REASONING_TRACE, DEDUP_OF_TREND_ID
        )
        SELECT
          c.value:candidate_id::STRING,
          c.value:agent_session_id::STRING,
          c.value:chain_id::STRING,
          c.value:iteration::NUMBER,
          c.value:topic::STRING,
          c.value:supporting_signal_ids,
          c.value:confidence::FLOAT,
          c.value:specificity_score::FLOAT,
          c.value:source_breakdown,
          c.value:bucket::STRING,
          c.value:verdict::STRING,
          c.value:evidence_added,
          c.value:reasoning::STRING,
          c.value:reasoning_trace,
          c.value:dedup_of_trend_id::STRING
        FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) c
        WHERE :1 != '[]'
      params:
      - "{{steps.run_lead_agent.$return_value.candidates_json}}"
- namespace: commit_promoted_trends
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS (
          TREND_ID, CANDIDATE_ID, TREND_TOPIC, AGENT_SESSION_ID, CHAIN_ID,
          DETECTED_AT, LAST_UPDATE_AT, PROMOTED_AT,
          TOTAL_CLUSTER_SIZE, DISTINCT_SOURCE_COUNT,
          CONFIDENCE, SPECIFICITY_SCORE, VELOCITY_DIRECTION
        )
        SELECT
          UUID_STRING(), c.CANDIDATE_ID, c.TOPIC, c.AGENT_SESSION_ID, c.CHAIN_ID,
          c.CREATED_AT, c.CREATED_AT, CURRENT_TIMESTAMP(),
          ARRAY_SIZE(c.SUPPORTING_SIGNAL_IDS),
          ARRAY_SIZE(OBJECT_KEYS(c.SOURCE_BREAKDOWN)),
          c.CONFIDENCE, c.SPECIFICITY_SCORE, 'NEW'
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
        WHERE c.AGENT_SESSION_ID = '{{steps.normalize_event.$return_value.agent_session_id}}'
          AND c.VERDICT = 'REAL_TREND'
          AND c.PROMOTED_AT IS NULL
      query: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS (
          TREND_ID, CANDIDATE_ID, TREND_TOPIC, AGENT_SESSION_ID, CHAIN_ID,
          DETECTED_AT, LAST_UPDATE_AT, PROMOTED_AT,
          TOTAL_CLUSTER_SIZE, DISTINCT_SOURCE_COUNT,
          CONFIDENCE, SPECIFICITY_SCORE, VELOCITY_DIRECTION
        )
        SELECT
          UUID_STRING(), c.CANDIDATE_ID, c.TOPIC, c.AGENT_SESSION_ID, c.CHAIN_ID,
          c.CREATED_AT, c.CREATED_AT, CURRENT_TIMESTAMP(),
          ARRAY_SIZE(c.SUPPORTING_SIGNAL_IDS),
          ARRAY_SIZE(OBJECT_KEYS(c.SOURCE_BREAKDOWN)),
          c.CONFIDENCE, c.SPECIFICITY_SCORE, 'NEW'
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
        WHERE c.AGENT_SESSION_ID = '{{steps.normalize_event.$return_value.agent_session_id}}'
          AND c.VERDICT = 'REAL_TREND'
          AND c.PROMOTED_AT IS NULL
      params: []
- namespace: commit_duplicate_updates
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        UPDATE MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS f
        SET LAST_UPDATE_AT = CURRENT_TIMESTAMP()
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
        WHERE c.AGENT_SESSION_ID = '{{steps.normalize_event.$return_value.agent_session_id}}'
          AND c.VERDICT LIKE 'DUPLICATE_OF_%'
          AND c.DEDUP_OF_TREND_ID IS NOT NULL
          AND c.DEDUP_OF_TREND_ID = f.TREND_ID
          AND c.PROMOTED_AT IS NULL
      query: |-
        UPDATE MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS f
        SET LAST_UPDATE_AT = CURRENT_TIMESTAMP()
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
        WHERE c.AGENT_SESSION_ID = '{{steps.normalize_event.$return_value.agent_session_id}}'
          AND c.VERDICT LIKE 'DUPLICATE_OF_%'
          AND c.DEDUP_OF_TREND_ID IS NOT NULL
          AND c.DEDUP_OF_TREND_ID = f.TREND_ID
          AND c.PROMOTED_AT IS NULL
      params: []
