- namespace: run_lead_agent
  runtime: nodejs20.x
  uses: "./run_lead_agent/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    selected_candidates: "{{steps.extract_candidate_ids.$return_value.selected}}"
    vectors_and_neighbors: "{{steps.q_compute_vectors_and_neighbors.$return_value}}"
    neighbor_signal_samples: "{{steps.q_load_neighbor_signal_samples.$return_value}}"
    intra_batch_pairs: "{{steps.q_compute_intra_batch_pairs.$return_value}}"
    subagent_url: https://eompw435droaqbo.m.pipedream.net
- namespace: apply_promotion
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_PROMOTION_APPLY(
          PARSE_JSON($${{steps.run_lead_agent.$return_value.bundle_json}}$$),
          '{{steps.normalize_event.$return_value.chain_id}}',
          {{steps.normalize_event.$return_value.iteration}}
        )
      query: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_PROMOTION_APPLY(
          PARSE_JSON($${{steps.run_lead_agent.$return_value.bundle_json}}$$),
          '{{steps.normalize_event.$return_value.chain_id}}',
          {{steps.normalize_event.$return_value.iteration}}
        )
      params: []
- namespace: fire_enrichment_chain
  runtime: nodejs20.x
  uses: "./fire_enrichment_chain/entry.js"
  props:
    apply_result: "{{steps.apply_promotion.$return_value}}"
    dispatcher_url: https://eoqf5zok2vcvael.m.pipedream.net
- namespace: eval_and_retrigger
  runtime: nodejs20.x
  uses: "./eval_and_retrigger/entry.js"
  props:
    chain_id: "{{steps.normalize_event.$return_value.chain_id}}"
    iteration: "{{steps.normalize_event.$return_value.iteration}}"
    max_iterations: "{{steps.normalize_event.$return_value.max_iterations}}"
    budget_usd: "{{steps.normalize_event.$return_value.budget_usd}}"
    budget_remaining_usd: "{{steps.normalize_event.$return_value.budget_remaining_usd}}"
    dry_run: "{{steps.normalize_event.$return_value.dry_run}}"
    max_candidates: "{{steps.normalize_event.$return_value.max_candidates}}"
    self_url: https://eot66usfdph5i7h.m.pipedream.net
    lead_result: "{{steps.run_lead_agent.$return_value}}"
    apply_result: "{{steps.apply_promotion.$return_value}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    lead_result: "{{steps.run_lead_agent.$return_value}}"
    apply_result: "{{steps.apply_promotion.$return_value}}"
    eval_result: "{{steps.eval_and_retrigger.$return_value}}"

