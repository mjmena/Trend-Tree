              'snowflake-arctic-embed-l-v2.0',
              COALESCE(c.TOPIC, '') || ' | ' ||
              COALESCE(LEFT(c.REASONING, 800), '') || ' | ' ||
              COALESCE(t.TOP_SIGNAL_TITLES, '')
            ) AS CANDIDATE_VECTOR
          FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
          LEFT JOIN candidate_signal_titles t ON c.CANDIDATE_ID = t.CANDIDATE_ID
          WHERE c.CANDIDATE_ID IN (SELECT VALUE::STRING FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))))
        )
        SELECT
          a.CANDIDATE_ID AS CANDIDATE_A_ID,
          b.CANDIDATE_ID AS CANDIDATE_B_ID,
          ROUND(VECTOR_COSINE_SIMILARITY(a.CANDIDATE_VECTOR, b.CANDIDATE_VECTOR), 4) AS SIMILARITY
