schema: workflow/2022.04
name: Lifecycle Subagent
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 600
triggers:
- id: dc_gzu74kR
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH lc AS (
          SELECT NEW_STATUS AS LIFECYCLE_STATUS, NEW_HEAT AS HEAT_INDEX,
                 NEW_HEAT_SMOOTHED AS HEAT_INDEX_SMOOTHED,
                 EVALUATED_AT AS LAST_EVAL_AT, NEXT_EVAL_AT,
                 DECISION_PAYLOAD:retirement_reason::STRING AS RETIREMENT_REASON
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          ORDER BY EVALUATED_AT DESC LIMIT 1
        ),
        e AS (
          SELECT WRITTEN_AT AS ENRICHED_AT,
                 PAYLOAD:summary_short::STRING AS SUMMARY_SHORT,
                 PAYLOAD:summary_long::STRING  AS SUMMARY_LONG,
                 PAYLOAD:vibe_shift::STRING    AS VIBE_SHIFT
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        ev AS (
          SELECT COUNT(*) AS ENRICHMENT_VERSION
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND ENRICHMENT_KIND IN ('initial', 'refinement')
        ),
        agg AS (
          SELECT
            (SELECT COUNT(DISTINCT f.value::STRING)
               FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c, LATERAL FLATTEN(INPUT => c.SUPPORTING_SIGNAL_IDS) f
              WHERE c.CANDIDATE_ID = (SELECT CANDIDATE_ID FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}')
                 OR c.DEDUP_OF_TREND_ID = '{{steps.handle_request.$return_value.trend_id}}') AS TOTAL_CLUSTER_SIZE,
            (SELECT COUNT(DISTINCT k.value::STRING)
               FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c, LATERAL FLATTEN(INPUT => OBJECT_KEYS(c.SOURCE_BREAKDOWN)) k
              WHERE c.CANDIDATE_ID = (SELECT CANDIDATE_ID FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}')
                 OR c.DEDUP_OF_TREND_ID = '{{steps.handle_request.$return_value.trend_id}}') AS DISTINCT_SOURCE_COUNT
        )
        SELECT
          t.TREND_ID, t.TREND_TOPIC, t.GTRENDS_KEYWORD,
          t.PROMOTED_AT, t.LAST_UPDATE_AT,
          t.TREND_NAME_B2B, t.TREND_NAME_B2C, t.CATEGORY, t.SUBCATEGORY,
          c.CONFIDENCE, c.SPECIFICITY_SCORE,
          agg.TOTAL_CLUSTER_SIZE, agg.DISTINCT_SOURCE_COUNT,
          lc.LIFECYCLE_STATUS, lc.HEAT_INDEX AS TREND_HEAT_INDEX,
          lc.HEAT_INDEX_SMOOTHED AS TREND_HEAT_INDEX_SMOOTHED,
          lc.LAST_EVAL_AT AS LAST_LIFECYCLE_EVAL_AT,
          lc.NEXT_EVAL_AT AS NEXT_LIFECYCLE_EVAL_AT,
          lc.RETIREMENT_REASON,
          e.SUMMARY_SHORT, e.SUMMARY_LONG, e.VIBE_SHIFT,
          e.ENRICHED_AT, ev.ENRICHMENT_VERSION
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN lc  ON TRUE
        LEFT JOIN e   ON TRUE
        LEFT JOIN ev  ON TRUE
        LEFT JOIN agg ON TRUE
        LEFT JOIN MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c ON c.CANDIDATE_ID = t.CANDIDATE_ID
        WHERE t.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
      query: |-
        WITH lc AS (
          SELECT NEW_STATUS AS LIFECYCLE_STATUS, NEW_HEAT AS HEAT_INDEX,
                 NEW_HEAT_SMOOTHED AS HEAT_INDEX_SMOOTHED,
                 EVALUATED_AT AS LAST_EVAL_AT, NEXT_EVAL_AT,
                 DECISION_PAYLOAD:retirement_reason::STRING AS RETIREMENT_REASON
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          ORDER BY EVALUATED_AT DESC LIMIT 1
        ),
        e AS (
          SELECT WRITTEN_AT AS ENRICHED_AT,
                 PAYLOAD:summary_short::STRING AS SUMMARY_SHORT,
                 PAYLOAD:summary_long::STRING  AS SUMMARY_LONG,
                 PAYLOAD:vibe_shift::STRING    AS VIBE_SHIFT
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        ev AS (
          SELECT COUNT(*) AS ENRICHMENT_VERSION
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND ENRICHMENT_KIND IN ('initial', 'refinement')
        ),
        agg AS (
          SELECT
            (SELECT COUNT(DISTINCT f.value::STRING)
               FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c, LATERAL FLATTEN(INPUT => c.SUPPORTING_SIGNAL_IDS) f
              WHERE c.CANDIDATE_ID = (SELECT CANDIDATE_ID FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}')
                 OR c.DEDUP_OF_TREND_ID = '{{steps.handle_request.$return_value.trend_id}}') AS TOTAL_CLUSTER_SIZE,
            (SELECT COUNT(DISTINCT k.value::STRING)
               FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c, LATERAL FLATTEN(INPUT => OBJECT_KEYS(c.SOURCE_BREAKDOWN)) k
              WHERE c.CANDIDATE_ID = (SELECT CANDIDATE_ID FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}')
                 OR c.DEDUP_OF_TREND_ID = '{{steps.handle_request.$return_value.trend_id}}') AS DISTINCT_SOURCE_COUNT
        )
        SELECT
          t.TREND_ID, t.TREND_TOPIC, t.GTRENDS_KEYWORD,
          t.PROMOTED_AT, t.LAST_UPDATE_AT,
          t.TREND_NAME_B2B, t.TREND_NAME_B2C, t.CATEGORY, t.SUBCATEGORY,
          c.CONFIDENCE, c.SPECIFICITY_SCORE,
          agg.TOTAL_CLUSTER_SIZE, agg.DISTINCT_SOURCE_COUNT,
          lc.LIFECYCLE_STATUS, lc.HEAT_INDEX AS TREND_HEAT_INDEX,
          lc.HEAT_INDEX_SMOOTHED AS TREND_HEAT_INDEX_SMOOTHED,
          lc.LAST_EVAL_AT AS LAST_LIFECYCLE_EVAL_AT,
          lc.NEXT_EVAL_AT AS NEXT_LIFECYCLE_EVAL_AT,
          lc.RETIREMENT_REASON,
          e.SUMMARY_SHORT, e.SUMMARY_LONG, e.VIBE_SHIFT,
          e.ENRICHED_AT, ev.ENRICHMENT_VERSION
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN lc  ON TRUE
        LEFT JOIN e   ON TRUE
        LEFT JOIN ev  ON TRUE
        LEFT JOIN agg ON TRUE
        LEFT JOIN MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c ON c.CANDIDATE_ID = t.CANDIDATE_ID
        WHERE t.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
    params: []
- namespace: q_source_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS, ENRICHED_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
      query: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS, ENRICHED_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
    params: []
- namespace: q_lifecycle_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT EVALUATED_AT, PRIOR_STATUS, NEW_STATUS, PRIOR_HEAT, NEW_HEAT,
               HEAT_MODIFIER_PCT, REASONING, RETIREMENT_PROPOSAL, REQUESTED_RE_ENRICHMENT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        ORDER BY EVALUATED_AT DESC
        LIMIT 5
      query: |-
        SELECT EVALUATED_AT, PRIOR_STATUS, NEW_STATUS, PRIOR_HEAT, NEW_HEAT,
               HEAT_MODIFIER_PCT, REASONING, RETIREMENT_PROPOSAL, REQUESTED_RE_ENRICHMENT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        ORDER BY EVALUATED_AT DESC
        LIMIT 5
    params: []
- namespace: q_recent_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
               s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 400) AS SIGNAL_TEXT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS ts
        JOIN MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          ON s.SIGNAL_ID = ts.SIGNAL_ID
        WHERE ts.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND s.SIGNAL_TIMESTAMP > DATEADD(day, -14, CURRENT_TIMESTAMP())
        ORDER BY s.SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 30
      query: |-
        SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
               s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 400) AS SIGNAL_TEXT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS ts
        JOIN MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          ON s.SIGNAL_ID = ts.SIGNAL_ID
        WHERE ts.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND s.SIGNAL_TIMESTAMP > DATEADD(day, -14, CURRENT_TIMESTAMP())
        ORDER BY s.SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 30
    params: []
- namespace: q_candidate_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH trend_vec AS (
          SELECT TREND_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND TREND_VECTOR IS NOT NULL
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        new_signals AS (
          SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
                 s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 300) AS SIGNAL_TEXT, s.SIGNAL_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          WHERE s.EMBEDDED_AT >= DATEADD(day, -7, CURRENT_TIMESTAMP())
            AND s.SIGNAL_VECTOR IS NOT NULL
            AND NOT EXISTS (
              SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
              WHERE x.SIGNAL_ID = s.SIGNAL_ID
                AND x.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            )
        ),
        scored AS (
          SELECT ns.SIGNAL_ID, ns.SOURCE_NAME, ns.SIGNAL_TIMESTAMP,
                 ns.SIGNAL_TITLE, ns.SIGNAL_TEXT,
                 VECTOR_COSINE_SIMILARITY(tv.TREND_VECTOR, ns.SIGNAL_VECTOR) AS SIMILARITY
          FROM trend_vec tv
          CROSS JOIN new_signals ns
        )
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP, SIGNAL_TITLE, SIGNAL_TEXT, SIMILARITY
        FROM scored
        WHERE SIMILARITY >= 0.45
        ORDER BY SIMILARITY DESC
        LIMIT 20
      query: |-
        WITH trend_vec AS (
          SELECT TREND_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND TREND_VECTOR IS NOT NULL
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        new_signals AS (
          SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
                 s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 300) AS SIGNAL_TEXT, s.SIGNAL_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          WHERE s.EMBEDDED_AT >= DATEADD(day, -7, CURRENT_TIMESTAMP())
            AND s.SIGNAL_VECTOR IS NOT NULL
            AND NOT EXISTS (
              SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
              WHERE x.SIGNAL_ID = s.SIGNAL_ID
                AND x.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            )
        ),
        scored AS (
          SELECT ns.SIGNAL_ID, ns.SOURCE_NAME, ns.SIGNAL_TIMESTAMP,
                 ns.SIGNAL_TITLE, ns.SIGNAL_TEXT,
                 VECTOR_COSINE_SIMILARITY(tv.TREND_VECTOR, ns.SIGNAL_VECTOR) AS SIMILARITY
          FROM trend_vec tv
          CROSS JOIN new_signals ns
        )
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP, SIGNAL_TITLE, SIGNAL_TEXT, SIMILARITY
        FROM scored
        WHERE SIMILARITY >= 0.45
        ORDER BY SIMILARITY DESC
        LIMIT 20
    params: []
- namespace: q_gtrends_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PULLED_AT, INTEREST_PEAK_PCT, INTEREST_AVG_PCT, RELATED_QUERIES
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_GTRENDS_DAILY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND PULLED_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY PULLED_AT DESC
      query: |-
        SELECT PULLED_AT, INTEREST_PEAK_PCT, INTEREST_AVG_PCT, RELATED_QUERIES
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_GTRENDS_DAILY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND PULLED_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY PULLED_AT DESC
    params: []
- namespace: q_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH target_vec AS (
          SELECT TREND_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND TREND_VECTOR IS NOT NULL
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        latest_enrichment AS (
          SELECT TREND_ID, TREND_VECTOR,
                 PAYLOAD:trend_name_b2c::STRING AS E_TREND_NAME_B2C,
                 PAYLOAD:category::STRING       AS E_CATEGORY,
                 PAYLOAD:subcategory::STRING    AS E_SUBCATEGORY,
                 PAYLOAD:summary_short::STRING  AS SUMMARY_SHORT
          FROM (
            SELECT TREND_ID, TREND_VECTOR, PAYLOAD,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          ) WHERE rn = 1
        ),
        latest_vector AS (
          SELECT TREND_ID, TREND_VECTOR
          FROM (
            SELECT TREND_ID, TREND_VECTOR,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
            WHERE TREND_VECTOR IS NOT NULL
          ) WHERE rn = 1
        ),
        latest_lifecycle AS (
          SELECT TREND_ID, NEW_STATUS AS LIFECYCLE_STATUS,
                 NEW_HEAT AS HEAT_INDEX, NEW_HEAT_SMOOTHED AS HEAT_INDEX_SMOOTHED
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, lc.LIFECYCLE_STATUS,
               COALESCE(lc.HEAT_INDEX_SMOOTHED, lc.HEAT_INDEX) AS HEAT,
               t.LAST_UPDATE_AT,
               COALESCE(t.TREND_NAME_B2C, e.E_TREND_NAME_B2C) AS TREND_NAME_B2C,
               COALESCE(t.CATEGORY,       e.E_CATEGORY)       AS CATEGORY,
               COALESCE(t.SUBCATEGORY,    e.E_SUBCATEGORY)    AS SUBCATEGORY,
               e.SUMMARY_SHORT,
               VECTOR_COSINE_SIMILARITY(lv.TREND_VECTOR, target_vec.TREND_VECTOR) AS SIMILARITY
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        CROSS JOIN target_vec
        LEFT JOIN latest_enrichment e ON e.TREND_ID = t.TREND_ID
        LEFT JOIN latest_vector     lv ON lv.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle  lc ON lc.TREND_ID = t.TREND_ID
        WHERE t.TREND_ID != '{{steps.handle_request.$return_value.trend_id}}'
          AND lv.TREND_VECTOR IS NOT NULL
        ORDER BY SIMILARITY DESC NULLS LAST
        LIMIT 30
      query: |-
        WITH target_vec AS (
          SELECT TREND_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND TREND_VECTOR IS NOT NULL
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        latest_enrichment AS (
          SELECT TREND_ID, TREND_VECTOR,
                 PAYLOAD:trend_name_b2c::STRING AS E_TREND_NAME_B2C,
                 PAYLOAD:category::STRING       AS E_CATEGORY,
                 PAYLOAD:subcategory::STRING    AS E_SUBCATEGORY,
                 PAYLOAD:summary_short::STRING  AS SUMMARY_SHORT
          FROM (
            SELECT TREND_ID, TREND_VECTOR, PAYLOAD,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          ) WHERE rn = 1
        ),
        latest_vector AS (
          SELECT TREND_ID, TREND_VECTOR
          FROM (
            SELECT TREND_ID, TREND_VECTOR,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
            WHERE TREND_VECTOR IS NOT NULL
          ) WHERE rn = 1
        ),
        latest_lifecycle AS (
          SELECT TREND_ID, NEW_STATUS AS LIFECYCLE_STATUS,
                 NEW_HEAT AS HEAT_INDEX, NEW_HEAT_SMOOTHED AS HEAT_INDEX_SMOOTHED
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, lc.LIFECYCLE_STATUS,
               COALESCE(lc.HEAT_INDEX_SMOOTHED, lc.HEAT_INDEX) AS HEAT,
               t.LAST_UPDATE_AT,
               COALESCE(t.TREND_NAME_B2C, e.E_TREND_NAME_B2C) AS TREND_NAME_B2C,
               COALESCE(t.CATEGORY,       e.E_CATEGORY)       AS CATEGORY,
               COALESCE(t.SUBCATEGORY,    e.E_SUBCATEGORY)    AS SUBCATEGORY,
               e.SUMMARY_SHORT,
               VECTOR_COSINE_SIMILARITY(lv.TREND_VECTOR, target_vec.TREND_VECTOR) AS SIMILARITY
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        CROSS JOIN target_vec
        LEFT JOIN latest_enrichment e ON e.TREND_ID = t.TREND_ID
        LEFT JOIN latest_vector     lv ON lv.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle  lc ON lc.TREND_ID = t.TREND_ID
        WHERE t.TREND_ID != '{{steps.handle_request.$return_value.trend_id}}'
          AND lv.TREND_VECTOR IS NOT NULL
        ORDER BY SIMILARITY DESC NULLS LAST
        LIMIT 30
    params: []
