schema: workflow/2022.04
name: Lifecycle Subagent
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: dc_gzu74kR   # lifecycle-subagent-http (customResponse=true)
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT
          t.TREND_ID, t.TREND_TOPIC,
          t.LIFECYCLE_STATUS, t.RETIREMENT_REASON,
          t.TOTAL_CLUSTER_SIZE, t.DISTINCT_SOURCE_COUNT,
          t.CONFIDENCE, t.SPECIFICITY_SCORE,
          COALESCE(t.TREND_HEAT_INDEX, 0) AS TREND_HEAT_INDEX,
          COALESCE(t.TREND_HEAT_INDEX_SMOOTHED, t.TREND_HEAT_INDEX) AS TREND_HEAT_INDEX_SMOOTHED,
          t.PROMOTED_AT, t.LAST_UPDATE_AT,
          t.LAST_LIFECYCLE_EVAL_AT, t.NEXT_LIFECYCLE_EVAL_AT,
          d.TREND_NAME_B2B, d.TREND_NAME_B2C, d.CATEGORY, d.SUBCATEGORY,
          d.SUMMARY_SHORT, d.SUMMARY_LONG, d.VIBE_SHIFT,
          d.ENRICHED_AT, d.ENRICHMENT_VERSION
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT d ON t.TREND_ID = d.TREND_ID
        WHERE t.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
      query: |-
        SELECT
          t.TREND_ID, t.TREND_TOPIC,
          t.LIFECYCLE_STATUS, t.RETIREMENT_REASON,
          t.TOTAL_CLUSTER_SIZE, t.DISTINCT_SOURCE_COUNT,
          t.CONFIDENCE, t.SPECIFICITY_SCORE,
          COALESCE(t.TREND_HEAT_INDEX, 0) AS TREND_HEAT_INDEX,
          COALESCE(t.TREND_HEAT_INDEX_SMOOTHED, t.TREND_HEAT_INDEX) AS TREND_HEAT_INDEX_SMOOTHED,
          t.PROMOTED_AT, t.LAST_UPDATE_AT,
          t.LAST_LIFECYCLE_EVAL_AT, t.NEXT_LIFECYCLE_EVAL_AT,
          d.TREND_NAME_B2B, d.TREND_NAME_B2C, d.CATEGORY, d.SUBCATEGORY,
          d.SUMMARY_SHORT, d.SUMMARY_LONG, d.VIBE_SHIFT,
          d.ENRICHED_AT, d.ENRICHMENT_VERSION
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT d ON t.TREND_ID = d.TREND_ID
        WHERE t.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
    params: []
- namespace: q_source_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS, ENRICHED_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
      query: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS, ENRICHED_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
    params: []
- namespace: q_lifecycle_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT EVALUATED_AT, PRIOR_STATUS, NEW_STATUS, PRIOR_HEAT, NEW_HEAT,
               HEAT_MODIFIER_PCT, REASONING, RETIREMENT_PROPOSAL, REQUESTED_RE_ENRICHMENT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_HISTORY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        ORDER BY EVALUATED_AT DESC
        LIMIT 5
      query: |-
        SELECT EVALUATED_AT, PRIOR_STATUS, NEW_STATUS, PRIOR_HEAT, NEW_HEAT,
               HEAT_MODIFIER_PCT, REASONING, RETIREMENT_PROPOSAL, REQUESTED_RE_ENRICHMENT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_HISTORY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        ORDER BY EVALUATED_AT DESC
        LIMIT 5
    params: []
- namespace: q_narrative_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT NARRATIVE_VERSION, WRITTEN_AT, WRITTEN_BY,
               SUMMARY_SHORT, VIBE_SHIFT, CHANGE_REASON
        FROM MCC_PRESENTATION.TREND_AGENT.DIM_TREND_NARRATIVE_HISTORY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        ORDER BY NARRATIVE_VERSION DESC
        LIMIT 3
      query: |-
        SELECT NARRATIVE_VERSION, WRITTEN_AT, WRITTEN_BY,
               SUMMARY_SHORT, VIBE_SHIFT, CHANGE_REASON
        FROM MCC_PRESENTATION.TREND_AGENT.DIM_TREND_NARRATIVE_HISTORY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        ORDER BY NARRATIVE_VERSION DESC
        LIMIT 3
    params: []
- namespace: q_recent_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
               s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 400) AS SIGNAL_TEXT
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c,
             LATERAL FLATTEN(INPUT => c.SUPPORTING_SIGNAL_IDS) f
        JOIN MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS s
          ON s.SIGNAL_ID = f.value::STRING
        WHERE (c.PROMOTED_TO = '{{steps.handle_request.$return_value.trend_id}}'
            OR c.DEDUP_OF_TREND_ID = '{{steps.handle_request.$return_value.trend_id}}')
          AND s.SIGNAL_TIMESTAMP > DATEADD(day, -14, CURRENT_TIMESTAMP())
        ORDER BY s.SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 30
      query: |-
        SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
               s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 400) AS SIGNAL_TEXT
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c,
             LATERAL FLATTEN(INPUT => c.SUPPORTING_SIGNAL_IDS) f
        JOIN MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS s
          ON s.SIGNAL_ID = f.value::STRING
        WHERE (c.PROMOTED_TO = '{{steps.handle_request.$return_value.trend_id}}'
            OR c.DEDUP_OF_TREND_ID = '{{steps.handle_request.$return_value.trend_id}}')
          AND s.SIGNAL_TIMESTAMP > DATEADD(day, -14, CURRENT_TIMESTAMP())
        ORDER BY s.SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 30
    params: []
- namespace: q_gtrends_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PULLED_AT, INTEREST_PEAK_PCT, INTEREST_AVG_PCT, RELATED_QUERIES
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_GTRENDS_DAILY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND PULLED_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY PULLED_AT DESC
      query: |-
        SELECT PULLED_AT, INTEREST_PEAK_PCT, INTEREST_AVG_PCT, RELATED_QUERIES
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_GTRENDS_DAILY
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND PULLED_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY PULLED_AT DESC
    params: []
- namespace: q_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH target AS (
          SELECT TREND_VECTOR FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, t.LIFECYCLE_STATUS,
               COALESCE(t.TREND_HEAT_INDEX_SMOOTHED, t.TREND_HEAT_INDEX) AS HEAT,
               t.LAST_UPDATE_AT,
               d.TREND_NAME_B2C, d.CATEGORY, d.SUBCATEGORY, d.SUMMARY_SHORT,
               VECTOR_COSINE_SIMILARITY(t.TREND_VECTOR, target.TREND_VECTOR) AS SIMILARITY
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        CROSS JOIN target
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT d ON t.TREND_ID = d.TREND_ID
        WHERE t.TREND_ID != '{{steps.handle_request.$return_value.trend_id}}'
          AND t.TREND_VECTOR IS NOT NULL
        ORDER BY SIMILARITY DESC NULLS LAST
        LIMIT 30
      query: |-
        WITH target AS (
          SELECT TREND_VECTOR FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, t.LIFECYCLE_STATUS,
               COALESCE(t.TREND_HEAT_INDEX_SMOOTHED, t.TREND_HEAT_INDEX) AS HEAT,
               t.LAST_UPDATE_AT,
               d.TREND_NAME_B2C, d.CATEGORY, d.SUBCATEGORY, d.SUMMARY_SHORT,
               VECTOR_COSINE_SIMILARITY(t.TREND_VECTOR, target.TREND_VECTOR) AS SIMILARITY
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        CROSS JOIN target
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT d ON t.TREND_ID = d.TREND_ID
        WHERE t.TREND_ID != '{{steps.handle_request.$return_value.trend_id}}'
          AND t.TREND_VECTOR IS NOT NULL
        ORDER BY SIMILARITY DESC NULLS LAST
        LIMIT 30
    params: []
- namespace: q_prompts
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('lifecycle.subagent.system', 'lifecycle.subagent.decision_rubric')
      query: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('lifecycle.subagent.system', 'lifecycle.subagent.decision_rubric')
    params: []
- namespace: run_subagent
  runtime: nodejs20.x
  uses: "./run_subagent/entry.js"
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    event: "{{steps.handle_request.$return_value}}"
    metrics_rows: "{{steps.q_metrics.$return_value}}"
    source_metrics_rows: "{{steps.q_source_metrics.$return_value}}"
    lifecycle_history_rows: "{{steps.q_lifecycle_history.$return_value}}"
    narrative_history_rows: "{{steps.q_narrative_history.$return_value}}"
    recent_signal_rows: "{{steps.q_recent_signals.$return_value}}"
    gtrends_rows: "{{steps.q_gtrends_history.$return_value}}"
    neighbor_rows: "{{steps.q_neighbors.$return_value}}"
    prompts_rows: "{{steps.q_prompts.$return_value}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.handle_request.$return_value}}"
    subagent_output: "{{steps.run_subagent.$return_value}}"
