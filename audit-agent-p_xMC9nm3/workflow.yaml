schema: workflow/2022.04
name: Audit Agent
settings:
  error_notification: true
  lambda_memory: 2048
  lambda_timeout: 300
triggers:
- id: ti_A6T29Do
- id: hi_dyHErEx
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_pipeline_freshness
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        -- All age values are precomputed in SQL as MINUTES_SINCE_LAST so the
        -- agent's JS layer doesn't have to parse Snowflake TIMESTAMP_NTZ
        -- strings (which serialize without TZ markers and were being
        -- mis-interpreted as UTC instead of America/New_York session TZ).
        WITH signal_24h AS (
          SELECT SOURCE_NAME, COUNT(*) AS CNT
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS
          WHERE SIGNAL_TIMESTAMP > DATEADD(hour, -24, CURRENT_TIMESTAMP())
          GROUP BY 1
        ),
        signal_7d AS (
          SELECT SOURCE_NAME, COUNT(*) / 7.0 AS DAILY_AVG
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS
          WHERE SIGNAL_TIMESTAMP > DATEADD(day, -7, CURRENT_TIMESTAMP())
          GROUP BY 1
        ),
        ingestion AS (
          SELECT 'ingestion' AS AREA,
                 COALESCE(s24.SOURCE_NAME, s7.SOURCE_NAME) AS KEY,
                 COALESCE(s24.CNT, 0)              AS COUNT_24H,
                 COALESCE(s7.DAILY_AVG, 0)         AS BASELINE_7D_DAILY_AVG,
                 NULL::NUMBER                      AS MINUTES_SINCE_LAST
          FROM signal_24h s24
          FULL OUTER JOIN signal_7d s7
            ON s24.SOURCE_NAME = s7.SOURCE_NAME
        ),
        promotion AS (
          SELECT 'promotion' AS AREA, 'all' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(DECIDED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_PROMOTION_LEDGER
          WHERE DECIDED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        ),
        enrichment_all AS (
          SELECT 'enrichment' AS AREA, 'all' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(WRITTEN_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE WRITTEN_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        ),
        enrichment_initial AS (
          SELECT 'enrichment' AS AREA, 'initial_only' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(WRITTEN_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE WRITTEN_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
            AND ENRICHMENT_KIND = 'initial'
        ),
        lifecycle_24h AS (
          SELECT 'lifecycle' AS AREA, 'all_24h' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(EVALUATED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          WHERE EVALUATED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        ),
        lifecycle_1h AS (
          SELECT 'lifecycle' AS AREA, 'last_1h' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(EVALUATED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          WHERE EVALUATED_AT > DATEADD(hour, -1, CURRENT_TIMESTAMP())
        ),
        distillation_pending AS (
          -- MINUTES_SINCE_LAST = age of the oldest pending candidate
          SELECT 'distillation' AS AREA, 'pending_oldest_hours' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MIN(CREATED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES
          WHERE PROMOTED_AT IS NULL
            AND REJECTED_AT IS NULL
            AND (DEFERRED_UNTIL IS NULL OR DEFERRED_UNTIL <= CURRENT_TIMESTAMP())
        ),
        distillation_processed AS (
          SELECT 'distillation' AS AREA, 'processed_24h' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 NULL::NUMBER AS MINUTES_SINCE_LAST
          FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES
          WHERE PROMOTED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
             OR REJECTED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        )
        SELECT * FROM ingestion
        UNION ALL SELECT * FROM promotion
        UNION ALL SELECT * FROM enrichment_all
        UNION ALL SELECT * FROM enrichment_initial
        UNION ALL SELECT * FROM lifecycle_24h
        UNION ALL SELECT * FROM lifecycle_1h
        UNION ALL SELECT * FROM distillation_pending
        UNION ALL SELECT * FROM distillation_processed
      query: |-
        -- All age values are precomputed in SQL as MINUTES_SINCE_LAST so the
        -- agent's JS layer doesn't have to parse Snowflake TIMESTAMP_NTZ
        -- strings (which serialize without TZ markers and were being
        -- mis-interpreted as UTC instead of America/New_York session TZ).
        WITH signal_24h AS (
          SELECT SOURCE_NAME, COUNT(*) AS CNT
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS
          WHERE SIGNAL_TIMESTAMP > DATEADD(hour, -24, CURRENT_TIMESTAMP())
          GROUP BY 1
        ),
        signal_7d AS (
          SELECT SOURCE_NAME, COUNT(*) / 7.0 AS DAILY_AVG
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS
          WHERE SIGNAL_TIMESTAMP > DATEADD(day, -7, CURRENT_TIMESTAMP())
          GROUP BY 1
        ),
        ingestion AS (
          SELECT 'ingestion' AS AREA,
                 COALESCE(s24.SOURCE_NAME, s7.SOURCE_NAME) AS KEY,
                 COALESCE(s24.CNT, 0)              AS COUNT_24H,
                 COALESCE(s7.DAILY_AVG, 0)         AS BASELINE_7D_DAILY_AVG,
                 NULL::NUMBER                      AS MINUTES_SINCE_LAST
          FROM signal_24h s24
          FULL OUTER JOIN signal_7d s7
            ON s24.SOURCE_NAME = s7.SOURCE_NAME
        ),
        promotion AS (
          SELECT 'promotion' AS AREA, 'all' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(DECIDED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_PROMOTION_LEDGER
          WHERE DECIDED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        ),
        enrichment_all AS (
          SELECT 'enrichment' AS AREA, 'all' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(WRITTEN_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE WRITTEN_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        ),
        enrichment_initial AS (
          SELECT 'enrichment' AS AREA, 'initial_only' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(WRITTEN_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE WRITTEN_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
            AND ENRICHMENT_KIND = 'initial'
        ),
        lifecycle_24h AS (
          SELECT 'lifecycle' AS AREA, 'all_24h' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(EVALUATED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          WHERE EVALUATED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        ),
        lifecycle_1h AS (
          SELECT 'lifecycle' AS AREA, 'last_1h' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MAX(EVALUATED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          WHERE EVALUATED_AT > DATEADD(hour, -1, CURRENT_TIMESTAMP())
        ),
        distillation_pending AS (
          -- MINUTES_SINCE_LAST = age of the oldest pending candidate
          SELECT 'distillation' AS AREA, 'pending_oldest_hours' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 TIMESTAMPDIFF(MINUTE, MIN(CREATED_AT), CURRENT_TIMESTAMP()) AS MINUTES_SINCE_LAST
          FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES
          WHERE PROMOTED_AT IS NULL
            AND REJECTED_AT IS NULL
            AND (DEFERRED_UNTIL IS NULL OR DEFERRED_UNTIL <= CURRENT_TIMESTAMP())
        ),
        distillation_processed AS (
          SELECT 'distillation' AS AREA, 'processed_24h' AS KEY,
                 COUNT(*) AS COUNT_24H, NULL::FLOAT AS BASELINE_7D_DAILY_AVG,
                 NULL::NUMBER AS MINUTES_SINCE_LAST
          FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES
          WHERE PROMOTED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
             OR REJECTED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        )
        SELECT * FROM ingestion
        UNION ALL SELECT * FROM promotion
        UNION ALL SELECT * FROM enrichment_all
        UNION ALL SELECT * FROM enrichment_initial
        UNION ALL SELECT * FROM lifecycle_24h
        UNION ALL SELECT * FROM lifecycle_1h
        UNION ALL SELECT * FROM distillation_pending
        UNION ALL SELECT * FROM distillation_processed
    params: []
- namespace: q_dashboard_freshness
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT NAME,
               LATEST_DATA_TIMESTAMP AS LAST_REFRESH_AT,
               TIMESTAMPDIFF(SECOND, LATEST_DATA_TIMESTAMP, CURRENT_TIMESTAMP()) / 60.0 AS LAST_REFRESH_AGE_MINUTES,
               LAST_COMPLETED_REFRESH_STATE AS LAST_STATE,
               LAST_COMPLETED_REFRESH_STATE_MESSAGE AS LAST_STATE_MESSAGE,
               MEAN_LAG_SEC,
               MAXIMUM_LAG_SEC,
               TARGET_LAG_SEC / 60.0 AS TARGET_LAG_MINUTES,
               SCHEDULING_STATE:state::STRING AS SCHEDULING_STATE
        FROM TABLE(MCC_PRESENTATION.INFORMATION_SCHEMA.DYNAMIC_TABLES())
        WHERE NAME = 'DT_TREND_DASHBOARD'
      query: |-
        SELECT NAME,
               LATEST_DATA_TIMESTAMP AS LAST_REFRESH_AT,
               TIMESTAMPDIFF(SECOND, LATEST_DATA_TIMESTAMP, CURRENT_TIMESTAMP()) / 60.0 AS LAST_REFRESH_AGE_MINUTES,
               LAST_COMPLETED_REFRESH_STATE AS LAST_STATE,
               LAST_COMPLETED_REFRESH_STATE_MESSAGE AS LAST_STATE_MESSAGE,
               MEAN_LAG_SEC,
               MAXIMUM_LAG_SEC,
               TARGET_LAG_SEC / 60.0 AS TARGET_LAG_MINUTES,
               SCHEDULING_STATE:state::STRING AS SCHEDULING_STATE
        FROM TABLE(MCC_PRESENTATION.INFORMATION_SCHEMA.DYNAMIC_TABLES())
        WHERE NAME = 'DT_TREND_DASHBOARD'
    params: []
- namespace: q_stuck_trends
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH latest_enrichment AS (
          SELECT TREND_ID, MAX(WRITTEN_AT) AS LAST_WRITTEN_AT
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE ENRICHMENT_KIND IN ('initial', 'refinement')
          GROUP BY TREND_ID
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, t.PROMOTED_AT,
               TIMESTAMPDIFF(HOUR, t.PROMOTED_AT, CURRENT_TIMESTAMP()) AS HOURS_SINCE_PROMOTED,
               le.LAST_WRITTEN_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN latest_enrichment le ON le.TREND_ID = t.TREND_ID
        WHERE t.PROMOTED_AT < DATEADD(hour, -6, CURRENT_TIMESTAMP())
          AND le.LAST_WRITTEN_AT IS NULL
        ORDER BY t.PROMOTED_AT ASC
        LIMIT 100
      query: |-
        WITH latest_enrichment AS (
          SELECT TREND_ID, MAX(WRITTEN_AT) AS LAST_WRITTEN_AT
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE ENRICHMENT_KIND IN ('initial', 'refinement')
          GROUP BY TREND_ID
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, t.PROMOTED_AT,
               TIMESTAMPDIFF(HOUR, t.PROMOTED_AT, CURRENT_TIMESTAMP()) AS HOURS_SINCE_PROMOTED,
               le.LAST_WRITTEN_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN latest_enrichment le ON le.TREND_ID = t.TREND_ID
        WHERE t.PROMOTED_AT < DATEADD(hour, -6, CURRENT_TIMESTAMP())
          AND le.LAST_WRITTEN_AT IS NULL
        ORDER BY t.PROMOTED_AT ASC
        LIMIT 100
    params: []
- namespace: q_orphan_trends
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        -- Active orphan trends: live (non-RETIRED) trends whose FCT_TREND_SIGNALS
        -- rows all point at SIGNAL_IDs that don't exist in FCT_SIGNALS. The
        -- migration-era backlog was purged 2026-05-26; this query is a tripwire
        -- to catch any new orphan accumulation from the distillation agent
        -- (which still emits hallucinated / legacy-format SIGNAL_IDs at ~1/week).
        SELECT COUNT(*) AS ACTIVE_ORPHAN_TRENDS
        FROM (
          SELECT ts.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS ts
          LEFT JOIN MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
            ON s.SIGNAL_ID = ts.SIGNAL_ID
          GROUP BY ts.TREND_ID
          HAVING COUNT(*) > 0 AND COUNT(s.SIGNAL_ID) = 0
        ) orphans
        WHERE orphans.TREND_ID IN (
          SELECT TREND_ID FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD
          WHERE LIFECYCLE_STATUS != 'RETIRED'
        )
      query: |-
        SELECT COUNT(*) AS ACTIVE_ORPHAN_TRENDS
        FROM (
          SELECT ts.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS ts
          LEFT JOIN MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
            ON s.SIGNAL_ID = ts.SIGNAL_ID
          GROUP BY ts.TREND_ID
          HAVING COUNT(*) > 0 AND COUNT(s.SIGNAL_ID) = 0
        ) orphans
        WHERE orphans.TREND_ID IN (
          SELECT TREND_ID FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD
          WHERE LIFECYCLE_STATUS != 'RETIRED'
        )
    params: []
- namespace: q_cost_24h
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT 'enrichment' AS AGENT, MODEL_USED, COUNT(*) AS RUNS,
               SUM(LLM_INPUT_TOKENS)  AS INPUT_TOKENS,
               SUM(LLM_OUTPUT_TOKENS) AS OUTPUT_TOKENS,
               SUM(LLM_COST_ESTIMATE) AS COST_USD
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
        WHERE WRITTEN_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        GROUP BY 1, 2
        UNION ALL
        SELECT 'lifecycle' AS AGENT, MODEL_USED, COUNT(*) AS RUNS,
               SUM(LLM_INPUT_TOKENS)  AS INPUT_TOKENS,
               SUM(LLM_OUTPUT_TOKENS) AS OUTPUT_TOKENS,
               SUM(LLM_COST_ESTIMATE) AS COST_USD
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
        WHERE EVALUATED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        GROUP BY 1, 2
        UNION ALL
        SELECT 'promotion' AS AGENT, MODEL_USED, COUNT(*) AS RUNS,
               SUM(INPUT_TOKENS)  AS INPUT_TOKENS,
               SUM(OUTPUT_TOKENS) AS OUTPUT_TOKENS,
               SUM(COST_ESTIMATE) AS COST_USD
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_PROMOTION_LEDGER
        WHERE DECIDED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        GROUP BY 1, 2
      query: |-
        SELECT 'enrichment' AS AGENT, MODEL_USED, COUNT(*) AS RUNS,
               SUM(LLM_INPUT_TOKENS)  AS INPUT_TOKENS,
               SUM(LLM_OUTPUT_TOKENS) AS OUTPUT_TOKENS,
               SUM(LLM_COST_ESTIMATE) AS COST_USD
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
        WHERE WRITTEN_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        GROUP BY 1, 2
        UNION ALL
        SELECT 'lifecycle' AS AGENT, MODEL_USED, COUNT(*) AS RUNS,
               SUM(LLM_INPUT_TOKENS)  AS INPUT_TOKENS,
               SUM(LLM_OUTPUT_TOKENS) AS OUTPUT_TOKENS,
               SUM(LLM_COST_ESTIMATE) AS COST_USD
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
        WHERE EVALUATED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        GROUP BY 1, 2
        UNION ALL
        SELECT 'promotion' AS AGENT, MODEL_USED, COUNT(*) AS RUNS,
               SUM(INPUT_TOKENS)  AS INPUT_TOKENS,
               SUM(OUTPUT_TOKENS) AS OUTPUT_TOKENS,
               SUM(COST_ESTIMATE) AS COST_USD
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_PROMOTION_LEDGER
        WHERE DECIDED_AT > DATEADD(hour, -24, CURRENT_TIMESTAMP())
        GROUP BY 1, 2
    params: []
- namespace: q_audit_prompts
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('audit.system', 'audit.report_rubric')
      query: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('audit.system', 'audit.report_rubric')
    params: []
- namespace: q_catalog_freshness
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        -- CRMA-775: catalog sync freshness guard. One row per sourcing TIER
        -- (only 'shopify' exists today, but a future Amazon/other tier would
        -- get its own row here rather than being silently averaged into it).
        -- MINUTES_SINCE_LAST_SEEN precomputed in SQL, same rationale as
        -- q_pipeline_freshness above: Snowflake TIMESTAMP_NTZ serializes
        -- without a TZ marker and gets mis-interpreted as UTC by the JS layer.
        SELECT
          TIER,
          MAX(LAST_SEEN_AT)                                                  AS LAST_SEEN_AT_MAX,
          TIMESTAMPDIFF(MINUTE, MAX(LAST_SEEN_AT), CURRENT_TIMESTAMP())      AS MINUTES_SINCE_LAST_SEEN,
          COUNT(*)                                                          AS ACTIVE_PRODUCT_COUNT
        FROM MCC_PRESENTATION.TREND_AGENT.DIM_CATALOG_PRODUCT
        WHERE CATALOG_STATUS = 'active'
        GROUP BY TIER
        ORDER BY TIER
      query: |-
        SELECT
          TIER,
          MAX(LAST_SEEN_AT)                                                  AS LAST_SEEN_AT_MAX,
          TIMESTAMPDIFF(MINUTE, MAX(LAST_SEEN_AT), CURRENT_TIMESTAMP())      AS MINUTES_SINCE_LAST_SEEN,
          COUNT(*)                                                          AS ACTIVE_PRODUCT_COUNT
        FROM MCC_PRESENTATION.TREND_AGENT.DIM_CATALOG_PRODUCT
        WHERE CATALOG_STATUS = 'active'
        GROUP BY TIER
        ORDER BY TIER
    params: []
- namespace: fetch_pipedream_errors
  runtime: nodejs20.x
  uses: "./fetch_pipedream_errors/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
- namespace: q_et_rescue
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        -- ET corroboration-oracle rescue funnel (ADR-0004), last 24h. One row.
        --   CANDS_24H / CANDS_WITH_QUERY_24H — slice-1 candidate QUERY authoring
        --     coverage (should approach 100%; 0% = distillation not authoring the
        --     atomic query, so ET rescue silently no-ops but still costs an LLM run).
        --   ET_CONSULTED_24H — single-family candidates routed into the subagent
        --     that hit Exploding Topics (the NEW LLM spend from the gate change).
        --   ET_RESCUED_24H — of those, promoted because ET supplied source #2.
        --   ET_CONSULTED_REJECTED_24H — consulted but not corroborated.
        --   ET_LEDGER_ROWS_24H — FCT_TREND_ET_LEDGER rows (should equal RESCUED).
        SELECT
          COUNT_IF(CREATED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP()))                                                          AS CANDS_24H,
          COUNT_IF(QUERY IS NOT NULL AND CREATED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP()))                                    AS CANDS_WITH_QUERY_24H,
          COUNT_IF(ET_CORROBORATION IS NOT NULL AND COALESCE(PROMOTED_AT,REJECTED_AT) > DATEADD(hour,-24,CURRENT_TIMESTAMP()))  AS ET_CONSULTED_24H,
          COUNT_IF(ET_WAS_SECOND_SOURCE = TRUE AND PROMOTED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP()))                         AS ET_RESCUED_24H,
          COUNT_IF(ET_CORROBORATION IS NOT NULL AND COALESCE(ET_WAS_SECOND_SOURCE,FALSE)=FALSE AND REJECTED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP())) AS ET_CONSULTED_REJECTED_24H,
          (SELECT COUNT(*) FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ET_LEDGER WHERE OBSERVED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP())) AS ET_LEDGER_ROWS_24H
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES
      query: |-
        SELECT
          COUNT_IF(CREATED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP()))                                                          AS CANDS_24H,
          COUNT_IF(QUERY IS NOT NULL AND CREATED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP()))                                    AS CANDS_WITH_QUERY_24H,
          COUNT_IF(ET_CORROBORATION IS NOT NULL AND COALESCE(PROMOTED_AT,REJECTED_AT) > DATEADD(hour,-24,CURRENT_TIMESTAMP()))  AS ET_CONSULTED_24H,
          COUNT_IF(ET_WAS_SECOND_SOURCE = TRUE AND PROMOTED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP()))                         AS ET_RESCUED_24H,
          COUNT_IF(ET_CORROBORATION IS NOT NULL AND COALESCE(ET_WAS_SECOND_SOURCE,FALSE)=FALSE AND REJECTED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP())) AS ET_CONSULTED_REJECTED_24H,
          (SELECT COUNT(*) FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ET_LEDGER WHERE OBSERVED_AT > DATEADD(hour,-24,CURRENT_TIMESTAMP())) AS ET_LEDGER_ROWS_24H
        FROM MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES
    params: []
