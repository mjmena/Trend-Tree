  props:
    slack:
      authProvisionId: apn_arhlGm8
    channelType:
      __lv:
        label: User / Direct Message
        value: im
    conversation:
      __lv:
        label: 'Direct messaging with: Martin Mena'
        value: D092AG6TUC9
    text: "{{steps.post_to_slack.$return_value.slack_text}}"
    as_user: true
    addToChannel: true
    thread_broadcast: false
    unfurl_links: false
    unfurl_media: false
