schema: workflow/2022.04
name: Write Enrichment
settings:
  error_notification: true
  lambda_memory: 2048
  lambda_timeout: 300
  network: net_5Lnie3
triggers:
- id: hi_VOHVGYB
steps:
- namespace: query_source_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.trigger.event.body.trend_id}}' AND HEADLINE_METRIC > 0
      query: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.trigger.event.body.trend_id}}' AND HEADLINE_METRIC > 0
      params: []
- namespace: compute_scores
  runtime: nodejs20.x
  uses: "./compute_scores/entry.js"
  props:
    trend_id: "{{steps.trigger.event.body.trend_id}}"
    enrichment_type: "{{steps.trigger.event.body.enrichment_type}}"
    llm_output: "{{steps.trigger.event.body.llm_output}}"
    source_metrics_rows: "{{steps.query_source_metrics.$return_value}}"
- namespace: merge_dim
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        MERGE INTO MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT AS tgt
        USING (SELECT PARSE_JSON($${{steps.compute_scores.$return_value.payload_json}}$$) AS p) AS src
        ON tgt.TREND_ID = src.p:trend_id::STRING
        WHEN MATCHED THEN UPDATE SET
          TREND_NAME_B2B          = src.p:trend_name_b2b::STRING,
          TREND_NAME_B2C          = src.p:trend_name_b2c::STRING,
          SUMMARY_SHORT           = src.p:summary_short::STRING,
          SUMMARY_LONG            = src.p:summary_long::STRING,
          CATEGORY                = src.p:category::STRING,
          SUBCATEGORY             = src.p:subcategory::STRING,
          VOICE_OF_CUSTOMER       = src.p:voice_of_customer,
          VIBE_SHIFT              = src.p:vibe_shift::STRING,
          SOCIAL_NARRATIVE        = src.p:social_narrative::STRING,
          CULTURAL_DRIVERS        = src.p:cultural_drivers,
          SEASONAL_RELEVANCE      = src.p:seasonal_relevance,
          GEOGRAPHIC_HOTSPOTS     = src.p:geographic_hotspots,
          LLM_RESPONSES           = src.p:llm_responses,
          MODELS_USED             = src.p:models_used,
          LLM_TOKEN_USAGE         = src.p:llm_token_usage,
          LLM_TOTAL_TOKENS        = src.p:llm_total_tokens::NUMBER,
          LLM_COST_ESTIMATE       = src.p:llm_cost_estimate::FLOAT,
          ENRICHED_AT             = CURRENT_TIMESTAMP(),
          ENRICHMENT_VERSION      = COALESCE(tgt.ENRICHMENT_VERSION, 0) + 1
        WHEN NOT MATCHED AND src.p:trend_id IS NOT NULL THEN INSERT (
          TREND_ID,
          TREND_NAME_B2B, TREND_NAME_B2C,
          SUMMARY_SHORT, SUMMARY_LONG,
          CATEGORY, SUBCATEGORY,
          VOICE_OF_CUSTOMER, VIBE_SHIFT, SOCIAL_NARRATIVE,
          CULTURAL_DRIVERS, SEASONAL_RELEVANCE, GEOGRAPHIC_HOTSPOTS,
          LLM_RESPONSES, MODELS_USED,
          LLM_TOKEN_USAGE, LLM_TOTAL_TOKENS, LLM_COST_ESTIMATE
        ) VALUES (
          src.p:trend_id::STRING,
          src.p:trend_name_b2b::STRING, src.p:trend_name_b2c::STRING,
          src.p:summary_short::STRING, src.p:summary_long::STRING,
          src.p:category::STRING, src.p:subcategory::STRING,
          src.p:voice_of_customer, src.p:vibe_shift::STRING, src.p:social_narrative::STRING,
          src.p:cultural_drivers, src.p:seasonal_relevance, src.p:geographic_hotspots,
          src.p:llm_responses, src.p:models_used,
          src.p:llm_token_usage, src.p:llm_total_tokens::NUMBER, src.p:llm_cost_estimate::FLOAT
        )
      query: |-
        MERGE INTO MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT AS tgt
        USING (SELECT PARSE_JSON($${{steps.compute_scores.$return_value.payload_json}}$$) AS p) AS src
        ON tgt.TREND_ID = src.p:trend_id::STRING
        WHEN MATCHED THEN UPDATE SET
          TREND_NAME_B2B          = src.p:trend_name_b2b::STRING,
          TREND_NAME_B2C          = src.p:trend_name_b2c::STRING,
          SUMMARY_SHORT           = src.p:summary_short::STRING,
          SUMMARY_LONG            = src.p:summary_long::STRING,
          CATEGORY                = src.p:category::STRING,
          SUBCATEGORY             = src.p:subcategory::STRING,
          VOICE_OF_CUSTOMER       = src.p:voice_of_customer,
          VIBE_SHIFT              = src.p:vibe_shift::STRING,
          SOCIAL_NARRATIVE        = src.p:social_narrative::STRING,
          CULTURAL_DRIVERS        = src.p:cultural_drivers,
          SEASONAL_RELEVANCE      = src.p:seasonal_relevance,
          GEOGRAPHIC_HOTSPOTS     = src.p:geographic_hotspots,
          LLM_RESPONSES           = src.p:llm_responses,
          MODELS_USED             = src.p:models_used,
          LLM_TOKEN_USAGE         = src.p:llm_token_usage,
          LLM_TOTAL_TOKENS        = src.p:llm_total_tokens::NUMBER,
          LLM_COST_ESTIMATE       = src.p:llm_cost_estimate::FLOAT,
          ENRICHED_AT             = CURRENT_TIMESTAMP(),
          ENRICHMENT_VERSION      = COALESCE(tgt.ENRICHMENT_VERSION, 0) + 1
        WHEN NOT MATCHED AND src.p:trend_id IS NOT NULL THEN INSERT (
          TREND_ID,
          TREND_NAME_B2B, TREND_NAME_B2C,
          SUMMARY_SHORT, SUMMARY_LONG,
          CATEGORY, SUBCATEGORY,
          VOICE_OF_CUSTOMER, VIBE_SHIFT, SOCIAL_NARRATIVE,
          CULTURAL_DRIVERS, SEASONAL_RELEVANCE, GEOGRAPHIC_HOTSPOTS,
          LLM_RESPONSES, MODELS_USED,
          LLM_TOKEN_USAGE, LLM_TOTAL_TOKENS, LLM_COST_ESTIMATE
        ) VALUES (
          src.p:trend_id::STRING,
          src.p:trend_name_b2b::STRING, src.p:trend_name_b2c::STRING,
          src.p:summary_short::STRING, src.p:summary_long::STRING,
          src.p:category::STRING, src.p:subcategory::STRING,
          src.p:voice_of_customer, src.p:vibe_shift::STRING, src.p:social_narrative::STRING,
          src.p:cultural_drivers, src.p:seasonal_relevance, src.p:geographic_hotspots,
          src.p:llm_responses, src.p:models_used,
          src.p:llm_token_usage, src.p:llm_total_tokens::NUMBER, src.p:llm_cost_estimate::FLOAT
        )
      params: []
- namespace: insert_history
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_HISTORY (
          TREND_ID, SNAPSHOT_DATE,
          SOURCE_METRICS_SNAPSHOT,
          CATEGORY,
          LLM_TOTAL_TOKENS, LLM_COST_ESTIMATE
        )
        SELECT
          src.p:trend_id::STRING, CURRENT_DATE(),
          src.p:source_metrics_snapshot,
          src.p:category::STRING,
          src.p:llm_total_tokens::NUMBER,
          src.p:llm_cost_estimate::FLOAT
        FROM (SELECT PARSE_JSON($${{steps.compute_scores.$return_value.payload_json}}$$) AS p) src
        WHERE src.p:trend_id::STRING IS NOT NULL
          AND NOT EXISTS (
            SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_HISTORY h
            WHERE h.TREND_ID = src.p:trend_id::STRING
              AND h.SNAPSHOT_DATE = CURRENT_DATE()
          )
      query: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_HISTORY (
          TREND_ID, SNAPSHOT_DATE,
          SOURCE_METRICS_SNAPSHOT,
          CATEGORY,
          LLM_TOTAL_TOKENS, LLM_COST_ESTIMATE
        )
        SELECT
          src.p:trend_id::STRING, CURRENT_DATE(),
          src.p:source_metrics_snapshot,
          src.p:category::STRING,
          src.p:llm_total_tokens::NUMBER,
          src.p:llm_cost_estimate::FLOAT
        FROM (SELECT PARSE_JSON($${{steps.compute_scores.$return_value.payload_json}}$$) AS p) src
        WHERE src.p:trend_id::STRING IS NOT NULL
          AND NOT EXISTS (
            SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_HISTORY h
            WHERE h.TREND_ID = src.p:trend_id::STRING
              AND h.SNAPSHOT_DATE = CURRENT_DATE()
          )
      params: []
- namespace: update_queue
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_ENRICHMENT_QUEUE
        SET STATUS = 'COMPLETED',
            COMPLETED_AT = CURRENT_TIMESTAMP(),
            ENRICHMENT_TIER = '{{steps.compute_scores.$return_value.tier}}',
            LLM_TOTAL_TOKENS = {{steps.compute_scores.$return_value.llm_total_tokens}},
            LLM_COST_ESTIMATE = {{steps.compute_scores.$return_value.llm_cost_estimate}},
            DURATION_SECONDS = DATEDIFF('second', COALESCE(STARTED_AT, QUEUED_AT), CURRENT_TIMESTAMP())
        WHERE TREND_ID = '{{steps.trigger.event.body.trend_id}}' AND STATUS IN ('PENDING', 'IN_PROGRESS')
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_ENRICHMENT_QUEUE
        SET STATUS = 'COMPLETED',
            COMPLETED_AT = CURRENT_TIMESTAMP(),
            ENRICHMENT_TIER = '{{steps.compute_scores.$return_value.tier}}',
            LLM_TOTAL_TOKENS = {{steps.compute_scores.$return_value.llm_total_tokens}},
            LLM_COST_ESTIMATE = {{steps.compute_scores.$return_value.llm_cost_estimate}},
            DURATION_SECONDS = DATEDIFF('second', COALESCE(STARTED_AT, QUEUED_AT), CURRENT_TIMESTAMP())
        WHERE TREND_ID = '{{steps.trigger.event.body.trend_id}}' AND STATUS IN ('PENDING', 'IN_PROGRESS')
      params: []
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    compute_scores_output: "{{steps.compute_scores.$return_value}}"
    merge_dim_result: "{{steps.merge_dim.$return_value}}"
    insert_history_result: "{{steps.insert_history.$return_value}}"
    update_queue_result: "{{steps.update_queue.$return_value}}"
