schema: workflow/2022.04
name: Write Enrichment
settings:
  error_notification: true
  lambda_memory: 2048
  lambda_timeout: 300
  network: net_5Lnie3
triggers:
- id: hi_VOHVGYB
steps:
- namespace: query_source_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.trigger.event.body.trend_id}}' AND HEADLINE_METRIC > 0
      query: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.trigger.event.body.trend_id}}' AND HEADLINE_METRIC > 0
      params: []
- namespace: compute_scores
  runtime: nodejs20.x
  uses: "./compute_scores/entry.js"
  props:
    trend_id: "{{steps.trigger.event.body.trend_id}}"
    enrichment_type: "{{steps.trigger.event.body.enrichment_type}}"
    llm_output: "{{steps.trigger.event.body.llm_output}}"
    source_metrics_rows: "{{steps.query_source_metrics.$return_value}}"
- namespace: call_proc
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_ENRICHMENT_APPLY(
          '{{steps.trigger.event.body.trend_id}}',
          PARSE_JSON($${{steps.compute_scores.$return_value.payload_json}}$$),
          NULL::ARRAY,
          NULL::VARCHAR,
          NULL::VARCHAR,
          'initial',
          'claude-sonnet-4-6',
          {{steps.trigger.event.body.llm_output.llm_token_usage.total.input}}::NUMBER,
          {{steps.trigger.event.body.llm_output.llm_token_usage.total.output}}::NUMBER,
          {{steps.compute_scores.$return_value.llm_cost_estimate}}::FLOAT
        )
      query: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_ENRICHMENT_APPLY(
          '{{steps.trigger.event.body.trend_id}}',
          PARSE_JSON($${{steps.compute_scores.$return_value.payload_json}}$$),
          NULL::ARRAY,
          NULL::VARCHAR,
          NULL::VARCHAR,
          'initial',
          'claude-sonnet-4-6',
          {{steps.trigger.event.body.llm_output.llm_token_usage.total.input}}::NUMBER,
          {{steps.trigger.event.body.llm_output.llm_token_usage.total.output}}::NUMBER,
          {{steps.compute_scores.$return_value.llm_cost_estimate}}::FLOAT
        )
      params: []
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    compute_scores_output: "{{steps.compute_scores.$return_value}}"
    call_proc_result: "{{steps.call_proc.$return_value}}"
