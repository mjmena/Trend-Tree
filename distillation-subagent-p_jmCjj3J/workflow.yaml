  lambda_memory: 4096
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: hi_2VH6DQX
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_fetch_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 1500) AS SIGNAL_TEXT,
               METADATA, AGENT_SESSION_ID
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_ID IN ({{steps.handle_request.$return_value.signal_ids_sql_in}})
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 200
      query: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 1500) AS SIGNAL_TEXT,
               METADATA, AGENT_SESSION_ID
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_ID IN ({{steps.handle_request.$return_value.signal_ids_sql_in}})
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 200
      params: []
- namespace: q_fetch_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID,
                 NEW_STATUS         AS LIFECYCLE_STATUS,
                 NEW_HEAT_SMOOTHED  AS HEAT_SMOOTHED,
                 NEW_HEAT           AS HEAT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        ),
        tc_for_agg AS (
          SELECT t.TREND_ID, c.SUPPORTING_SIGNAL_IDS, c.SOURCE_BREAKDOWN
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
          JOIN MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
            ON c.CANDIDATE_ID = t.CANDIDATE_ID OR c.DEDUP_OF_TREND_ID = t.TREND_ID
        ),
        cluster_sizes AS (
          SELECT TREND_ID, COUNT(DISTINCT f.value::STRING) AS TOTAL_CLUSTER_SIZE
          FROM tc_for_agg, LATERAL FLATTEN(INPUT => SUPPORTING_SIGNAL_IDS) f
          GROUP BY TREND_ID
        ),
        source_counts AS (
          SELECT TREND_ID, COUNT(DISTINCT k.value::STRING) AS DISTINCT_SOURCE_COUNT
          FROM tc_for_agg, LATERAL FLATTEN(INPUT => OBJECT_KEYS(SOURCE_BREAKDOWN)) k
          GROUP BY TREND_ID
        )
        SELECT m.TREND_ID, m.TREND_TOPIC,
               COALESCE(cs.TOTAL_CLUSTER_SIZE,    0)    AS TOTAL_CLUSTER_SIZE,
               COALESCE(sc.DISTINCT_SOURCE_COUNT, 0)    AS DISTINCT_SOURCE_COUNT,
               COALESCE(lc.LIFECYCLE_STATUS, 'NEW')     AS VELOCITY_DIRECTION,
               COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0)   AS TREND_HEAT_INDEX,
               m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS m
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = m.TREND_ID
        LEFT JOIN cluster_sizes    cs ON cs.TREND_ID = m.TREND_ID
        LEFT JOIN source_counts    sc ON sc.TREND_ID = m.TREND_ID
        WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') != 'RETIRED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0) DESC NULLS LAST
        LIMIT 100
      query: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID,
                 NEW_STATUS         AS LIFECYCLE_STATUS,
                 NEW_HEAT_SMOOTHED  AS HEAT_SMOOTHED,
                 NEW_HEAT           AS HEAT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        ),
        tc_for_agg AS (
          SELECT t.TREND_ID, c.SUPPORTING_SIGNAL_IDS, c.SOURCE_BREAKDOWN
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
          JOIN MCC_RAW.MARKETING_DEV.STG_TREND_CANDIDATES c
            ON c.CANDIDATE_ID = t.CANDIDATE_ID OR c.DEDUP_OF_TREND_ID = t.TREND_ID
        ),
        cluster_sizes AS (
          SELECT TREND_ID, COUNT(DISTINCT f.value::STRING) AS TOTAL_CLUSTER_SIZE
          FROM tc_for_agg, LATERAL FLATTEN(INPUT => SUPPORTING_SIGNAL_IDS) f
          GROUP BY TREND_ID
        ),
        source_counts AS (
          SELECT TREND_ID, COUNT(DISTINCT k.value::STRING) AS DISTINCT_SOURCE_COUNT
          FROM tc_for_agg, LATERAL FLATTEN(INPUT => OBJECT_KEYS(SOURCE_BREAKDOWN)) k
          GROUP BY TREND_ID
        )
        SELECT m.TREND_ID, m.TREND_TOPIC,
               COALESCE(cs.TOTAL_CLUSTER_SIZE,    0)    AS TOTAL_CLUSTER_SIZE,
               COALESCE(sc.DISTINCT_SOURCE_COUNT, 0)    AS DISTINCT_SOURCE_COUNT,
               COALESCE(lc.LIFECYCLE_STATUS, 'NEW')     AS VELOCITY_DIRECTION,
               COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0)   AS TREND_HEAT_INDEX,
               m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS m
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = m.TREND_ID
        LEFT JOIN cluster_sizes    cs ON cs.TREND_ID = m.TREND_ID
        LEFT JOIN source_counts    sc ON sc.TREND_ID = m.TREND_ID
        WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') != 'RETIRED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0) DESC NULLS LAST
        LIMIT 100
      params: []
- namespace: q_load_prompts
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY = 'distillation.subagent.system'
      query: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY = 'distillation.subagent.system'
      params: []
- namespace: q_load_examples
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID,
                 NEW_STATUS         AS LIFECYCLE_STATUS,
                 NEW_HEAT_SMOOTHED  AS HEAT_SMOOTHED,
                 NEW_HEAT           AS HEAT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        ),
        latest_enrichment AS (
          SELECT TREND_ID,
                 PAYLOAD:summary_short::STRING  AS SUMMARY_SHORT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_NAME_B2B, t.TREND_NAME_B2C, t.CATEGORY, t.SUBCATEGORY,
               e.SUMMARY_SHORT,
               COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0) AS TREND_HEAT_INDEX
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        JOIN latest_enrichment e ON e.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE t.TREND_NAME_B2B IS NOT NULL
          AND COALESCE(lc.LIFECYCLE_STATUS, 'NEW') != 'RETIRED'
          AND t.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY TREND_HEAT_INDEX DESC NULLS LAST
        LIMIT 20
      query: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID,
                 NEW_STATUS         AS LIFECYCLE_STATUS,
                 NEW_HEAT_SMOOTHED  AS HEAT_SMOOTHED,
                 NEW_HEAT           AS HEAT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        ),
        latest_enrichment AS (
          SELECT TREND_ID,
                 PAYLOAD:summary_short::STRING  AS SUMMARY_SHORT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_NAME_B2B, t.TREND_NAME_B2C, t.CATEGORY, t.SUBCATEGORY,
               e.SUMMARY_SHORT,
               COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0) AS TREND_HEAT_INDEX
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        JOIN latest_enrichment e ON e.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE t.TREND_NAME_B2B IS NOT NULL
          AND COALESCE(lc.LIFECYCLE_STATUS, 'NEW') != 'RETIRED'
          AND t.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY TREND_HEAT_INDEX DESC NULLS LAST
        LIMIT 20
      params: []
- namespace: run_subagent
