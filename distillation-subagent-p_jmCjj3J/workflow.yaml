schema: workflow/2022.04
name: Distillation Subagent
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: hi_2VH6DQX
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_fetch_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 1500) AS SIGNAL_TEXT,
               METADATA, AGENT_SESSION_ID
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_ID IN ({{steps.handle_request.$return_value.signal_ids_sql_in}})
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 200
      query: |-
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP,
               SIGNAL_TITLE, LEFT(SIGNAL_TEXT, 1500) AS SIGNAL_TEXT,
               METADATA, AGENT_SESSION_ID
        FROM MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        WHERE SIGNAL_ID IN ({{steps.handle_request.$return_value.signal_ids_sql_in}})
        ORDER BY SIGNAL_TIMESTAMP DESC NULLS LAST
        LIMIT 200
      params: []
- namespace: q_fetch_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT m.TREND_ID, m.TREND_TOPIC, m.TOTAL_CLUSTER_SIZE,
               m.DISTINCT_SOURCE_COUNT, m.VELOCITY_DIRECTION,
               m.TREND_HEAT_INDEX, m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        WHERE m.VELOCITY_DIRECTION != 'SUPERSEDED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY m.TREND_HEAT_INDEX DESC NULLS LAST
        LIMIT 100
      query: |-
        SELECT m.TREND_ID, m.TREND_TOPIC, m.TOTAL_CLUSTER_SIZE,
               m.DISTINCT_SOURCE_COUNT, m.VELOCITY_DIRECTION,
               m.TREND_HEAT_INDEX, m.LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS m
        WHERE m.VELOCITY_DIRECTION != 'SUPERSEDED'
          AND m.LAST_UPDATE_AT > DATEADD(day, -30, CURRENT_TIMESTAMP())
        ORDER BY m.TREND_HEAT_INDEX DESC NULLS LAST
        LIMIT 100
      params: []
- namespace: q_load_prompts
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN (
            'distillation.subagent.system',
            'distillation.subagent.bucket_instructions.overlap',
            'distillation.subagent.bucket_instructions.agent_only',
            'distillation.subagent.bucket_instructions.louvain_only',
            'distillation.subagent.ingest_guidance.overlap',
            'distillation.subagent.ingest_guidance.agent_only',
            'distillation.subagent.ingest_guidance.louvain_only'
          )
      query: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN (
            'distillation.subagent.system',
            'distillation.subagent.bucket_instructions.overlap',
            'distillation.subagent.bucket_instructions.agent_only',
            'distillation.subagent.bucket_instructions.louvain_only',
            'distillation.subagent.ingest_guidance.overlap',
            'distillation.subagent.ingest_guidance.agent_only',
            'distillation.subagent.ingest_guidance.louvain_only'
          )
      params: []
- namespace: q_load_examples
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT TREND_NAME_B2B, TREND_NAME_B2C, CATEGORY, SUBCATEGORY, SUMMARY_SHORT, TREND_HEAT_INDEX
        FROM MCC_PRESENTATION.TREND_AGENT.V_VALUABLE_TREND_EXAMPLES
      query: |-
        SELECT TREND_NAME_B2B, TREND_NAME_B2C, CATEGORY, SUBCATEGORY, SUMMARY_SHORT, TREND_HEAT_INDEX
        FROM MCC_PRESENTATION.TREND_AGENT.V_VALUABLE_TREND_EXAMPLES
      params: []
- namespace: run_subagent
  runtime: nodejs20.x
  uses: "./run_subagent/entry.js"
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    request: "{{steps.handle_request.$return_value}}"
    signal_rows: "{{steps.q_fetch_signals.$return_value}}"
    neighbor_rows: "{{steps.q_fetch_neighbors.$return_value}}"
    prompts_rows: "{{steps.q_load_prompts.$return_value}}"
    examples_rows: "{{steps.q_load_examples.$return_value}}"
    bluesky_url: "https://eoydyalz1dslfre.m.pipedream.net"
    gdelt_url: "https://eoovhehfk229jrg.m.pipedream.net"
    gtrends_url: "https://eov9u8rngcgi2z6.m.pipedream.net"
    grok_url: "https://eovzc5ljf76h3h6.m.pipedream.net"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    request: "{{steps.handle_request.$return_value}}"
    agent_result: "{{steps.run_subagent.$return_value}}"

