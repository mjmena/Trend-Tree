schema: workflow/2022.04
name: Lifecycle Attribution Subagent
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: hi_8GHljlW
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_trend_context
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH e AS (
          SELECT PAYLOAD:summary_short::STRING AS SUMMARY_SHORT,
                 PAYLOAD:summary_long::STRING  AS SUMMARY_LONG
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          ORDER BY WRITTEN_AT DESC LIMIT 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, t.TREND_NAME_B2C, t.TREND_NAME_B2B,
               t.CATEGORY, t.SUBCATEGORY, t.PROMOTED_AT,
               e.SUMMARY_SHORT, e.SUMMARY_LONG
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN e ON TRUE
        WHERE t.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
      query: |-
        WITH e AS (
          SELECT PAYLOAD:summary_short::STRING AS SUMMARY_SHORT,
                 PAYLOAD:summary_long::STRING  AS SUMMARY_LONG
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          ORDER BY WRITTEN_AT DESC LIMIT 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC, t.TREND_NAME_B2C, t.TREND_NAME_B2B,
               t.CATEGORY, t.SUBCATEGORY, t.PROMOTED_AT,
               e.SUMMARY_SHORT, e.SUMMARY_LONG
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN e ON TRUE
        WHERE t.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
    params: []
- namespace: q_existing_signal_sources
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT DISTINCT LINK_TYPE
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND LINK_TYPE IS NOT NULL
      query: |-
        SELECT DISTINCT LINK_TYPE
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS
        WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
          AND LINK_TYPE IS NOT NULL
    params: []
- namespace: q_candidate_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH trend_vec AS (
          SELECT TREND_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND TREND_VECTOR IS NOT NULL
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        new_signals AS (
          SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
                 s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 300) AS SIGNAL_TEXT, s.SIGNAL_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          WHERE s.EMBEDDED_AT >= DATEADD(hour, -24, CURRENT_TIMESTAMP())
            AND s.SIGNAL_VECTOR IS NOT NULL
            AND NOT EXISTS (
              SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
              WHERE x.SIGNAL_ID = s.SIGNAL_ID
                AND x.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            )
        ),
        scored AS (
          SELECT ns.SIGNAL_ID, ns.SOURCE_NAME, ns.SIGNAL_TIMESTAMP,
                 ns.SIGNAL_TITLE, ns.SIGNAL_TEXT,
                 VECTOR_COSINE_SIMILARITY(tv.TREND_VECTOR, ns.SIGNAL_VECTOR) AS SIMILARITY
          FROM trend_vec tv
          CROSS JOIN new_signals ns
        )
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP, SIGNAL_TITLE, SIGNAL_TEXT, SIMILARITY
        FROM scored
        WHERE SIMILARITY >= 0.45
        ORDER BY SIMILARITY DESC
        LIMIT 20
      query: |-
        WITH trend_vec AS (
          SELECT TREND_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          WHERE TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            AND TREND_VECTOR IS NOT NULL
          ORDER BY WRITTEN_AT DESC LIMIT 1
        ),
        new_signals AS (
          SELECT s.SIGNAL_ID, s.SOURCE_NAME, s.SIGNAL_TIMESTAMP,
                 s.SIGNAL_TITLE, LEFT(s.SIGNAL_TEXT, 300) AS SIGNAL_TEXT, s.SIGNAL_VECTOR
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          WHERE s.EMBEDDED_AT >= DATEADD(hour, -24, CURRENT_TIMESTAMP())
            AND s.SIGNAL_VECTOR IS NOT NULL
            AND NOT EXISTS (
              SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
              WHERE x.SIGNAL_ID = s.SIGNAL_ID
                AND x.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
            )
        ),
        scored AS (
          SELECT ns.SIGNAL_ID, ns.SOURCE_NAME, ns.SIGNAL_TIMESTAMP,
                 ns.SIGNAL_TITLE, ns.SIGNAL_TEXT,
                 VECTOR_COSINE_SIMILARITY(tv.TREND_VECTOR, ns.SIGNAL_VECTOR) AS SIMILARITY
          FROM trend_vec tv
          CROSS JOIN new_signals ns
        )
        SELECT SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP, SIGNAL_TITLE, SIGNAL_TEXT, SIMILARITY
        FROM scored
        WHERE SIMILARITY >= 0.45
        ORDER BY SIMILARITY DESC
        LIMIT 20
    params: []
- namespace: q_prompts
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('signal.attribution.system', 'signal.attribution.rubric')
      query: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('signal.attribution.system', 'signal.attribution.rubric')
    params: []
- namespace: run_subagent
  runtime: nodejs20.x
  uses: "./run_subagent/entry.js"
  props:
    google_gemini:
      authProvisionId: apn_EOhp9DY
    event: "{{steps.handle_request.$return_value}}"
    trend_context_rows: "{{steps.q_trend_context.$return_value}}"
    existing_sources_rows: "{{steps.q_existing_signal_sources.$return_value}}"
    candidate_signal_rows: "{{steps.q_candidate_signals.$return_value}}"
    prompts_rows: "{{steps.q_prompts.$return_value}}"
- namespace: commit_attributions
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS
            (TREND_ID, SIGNAL_ID, LINK_KIND, LINK_TYPE)
        SELECT '{{steps.handle_request.$return_value.trend_id}}' AS TREND_ID,
               f.value:signal_id::STRING AS SIGNAL_ID,
               'attributed' AS LINK_KIND,
               f.value:link_type::STRING AS LINK_TYPE
        FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) f
        WHERE NOT EXISTS (
          SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
          WHERE x.SIGNAL_ID = f.value:signal_id::STRING
            AND x.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        )
      query: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS
            (TREND_ID, SIGNAL_ID, LINK_KIND, LINK_TYPE)
        SELECT '{{steps.handle_request.$return_value.trend_id}}' AS TREND_ID,
               f.value:signal_id::STRING AS SIGNAL_ID,
               'attributed' AS LINK_KIND,
               f.value:link_type::STRING AS LINK_TYPE
        FROM TABLE(FLATTEN(INPUT => PARSE_JSON(:1))) f
        WHERE NOT EXISTS (
          SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
          WHERE x.SIGNAL_ID = f.value:signal_id::STRING
            AND x.TREND_ID = '{{steps.handle_request.$return_value.trend_id}}'
        )
      params:
      - "{{steps.run_subagent.$return_value.attributions_json}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.handle_request.$return_value}}"
    subagent_output: "{{steps.run_subagent.$return_value}}"
    commit_result: "{{steps.commit_attributions.$return_value}}"

