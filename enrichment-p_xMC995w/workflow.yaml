        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
      query: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
