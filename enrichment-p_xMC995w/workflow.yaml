- namespace: q_valuable_examples
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH latest_enrichment AS (
          SELECT TREND_ID,
                 PAYLOAD:summary_short::STRING  AS SUMMARY_SHORT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
          ) WHERE rn = 1
        ),
        latest_lifecycle AS (
          SELECT TREND_ID, NEW_HEAT_SMOOTHED AS HEAT_SMOOTHED, NEW_HEAT AS HEAT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_NAME_B2B, t.TREND_NAME_B2C, t.CATEGORY, t.SUBCATEGORY,
               e.SUMMARY_SHORT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        JOIN latest_enrichment e ON e.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE t.TREND_NAME_B2B IS NOT NULL
        ORDER BY COALESCE(lc.HEAT_SMOOTHED, lc.HEAT, 0) DESC NULLS LAST
        LIMIT 8
      query: |-
        WITH latest_enrichment AS (
          SELECT TREND_ID,
