schema: workflow/2022.04
name: Enrichment
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: hi_4EHDY9m
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT TREND_ID, TREND_TOPIC, TOTAL_CLUSTER_SIZE, DISTINCT_SOURCE_COUNT,
               VELOCITY_DIRECTION, COALESCE(TREND_HEAT_INDEX, 0) AS TREND_HEAT_INDEX,
               DETECTED_AT, LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS
        WHERE TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
      query: |-
        SELECT TREND_ID, TREND_TOPIC, TOTAL_CLUSTER_SIZE, DISTINCT_SOURCE_COUNT,
               VELOCITY_DIRECTION, COALESCE(TREND_HEAT_INDEX, 0) AS TREND_HEAT_INDEX,
               DETECTED_AT, LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS
        WHERE TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
    params: []
- namespace: q_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT s.URL, s.TITLE, s.SIGNAL_NAME, s.DOMAIN, s.DETECTED_AT,
               s.PAGERANK_SCORE, s.INGESTION_ID,
               x.SIGNAL_TEXT AS ARTICLE_BODY, x.METADATA AS SIGNAL_METADATA,
               x.SOURCE_NAME AS X_SOURCE_NAME
        FROM MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s
        LEFT JOIN MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS x ON x.SIGNAL_ID = s.URL
        WHERE s.TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
        ORDER BY s.PAGERANK_SCORE DESC NULLS LAST
        LIMIT 10
      query: |-
        SELECT s.URL, s.TITLE, s.SIGNAL_NAME, s.DOMAIN, s.DETECTED_AT,
               s.PAGERANK_SCORE, s.INGESTION_ID,
               x.SIGNAL_TEXT AS ARTICLE_BODY, x.METADATA AS SIGNAL_METADATA,
               x.SOURCE_NAME AS X_SOURCE_NAME
        FROM MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s
        LEFT JOIN MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS x ON x.SIGNAL_ID = s.URL
        WHERE s.TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
        ORDER BY s.PAGERANK_SCORE DESC NULLS LAST
        LIMIT 10
    params: []
- namespace: q_source_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
      query: |-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = '{{steps.normalize_event.$return_value.trend_id}}'
    params: []
- namespace: q_neighbors
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT t.TREND_ID, t.TREND_TOPIC, t.TOTAL_CLUSTER_SIZE,
               t.DISTINCT_SOURCE_COUNT, t.VELOCITY_DIRECTION,
               COALESCE(t.TREND_HEAT_INDEX, 0) AS TREND_HEAT_INDEX, t.LAST_UPDATE_AT,
               e.CATEGORY, e.SUBCATEGORY, e.TREND_NAME_B2C, e.SUMMARY_SHORT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT e ON t.TREND_ID = e.TREND_ID
        WHERE t.VELOCITY_DIRECTION != 'SUPERSEDED'
          AND t.LAST_UPDATE_AT > DATEADD(day, -14, CURRENT_TIMESTAMP())
          AND t.TREND_ID != '{{steps.normalize_event.$return_value.trend_id}}'
        ORDER BY COALESCE(t.TREND_HEAT_INDEX, 0) DESC NULLS LAST
        LIMIT 30
      query: |-
        SELECT t.TREND_ID, t.TREND_TOPIC, t.TOTAL_CLUSTER_SIZE,
               t.DISTINCT_SOURCE_COUNT, t.VELOCITY_DIRECTION,
               COALESCE(t.TREND_HEAT_INDEX, 0) AS TREND_HEAT_INDEX, t.LAST_UPDATE_AT,
               e.CATEGORY, e.SUBCATEGORY, e.TREND_NAME_B2C, e.SUMMARY_SHORT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN MCC_PRESENTATION.TREND_AGENT.DIM_TREND_ENRICHMENT e ON t.TREND_ID = e.TREND_ID
        WHERE t.VELOCITY_DIRECTION != 'SUPERSEDED'
          AND t.LAST_UPDATE_AT > DATEADD(day, -14, CURRENT_TIMESTAMP())
          AND t.TREND_ID != '{{steps.normalize_event.$return_value.trend_id}}'
        ORDER BY COALESCE(t.TREND_HEAT_INDEX, 0) DESC NULLS LAST
        LIMIT 30
    params: []
- namespace: q_prompts
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('enrichment.agent.system', 'enrichment.agent.naming_guidance', 'enrichment.agent.user', 'enrichment.reviewer.system')
      query: |-
        SELECT PROMPT_KEY, VERSION, MODEL, TEMPLATE, MODEL_PARAMS
        FROM MCC_RAW.MARKETING_DEV.DIM_LLM_PROMPT
        WHERE IS_ACTIVE = TRUE
          AND PROMPT_KEY IN ('enrichment.agent.system', 'enrichment.agent.naming_guidance', 'enrichment.agent.user', 'enrichment.reviewer.system')
    params: []
- namespace: q_valuable_examples
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT TREND_NAME_B2B, TREND_NAME_B2C, CATEGORY, SUBCATEGORY, SUMMARY_SHORT
        FROM MCC_PRESENTATION.TREND_AGENT.V_VALUABLE_TREND_EXAMPLES
        LIMIT 8
      query: |-
        SELECT TREND_NAME_B2B, TREND_NAME_B2C, CATEGORY, SUBCATEGORY, SUMMARY_SHORT
        FROM MCC_PRESENTATION.TREND_AGENT.V_VALUABLE_TREND_EXAMPLES
        LIMIT 8
    params: []
- namespace: run_enrichment_agent
  runtime: nodejs20.x
  uses: "./run_enrichment_agent/entry.js"
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    event: "{{steps.normalize_event.$return_value}}"
    metrics_rows: "{{steps.q_metrics.$return_value}}"
    signal_rows: "{{steps.q_signals.$return_value}}"
    source_metrics_rows: "{{steps.q_source_metrics.$return_value}}"
    neighbor_rows: "{{steps.q_neighbors.$return_value}}"
    prompts_rows: "{{steps.q_prompts.$return_value}}"
    examples_rows: "{{steps.q_valuable_examples.$return_value}}"
    bluesky_url: https://eoydyalz1dslfre.m.pipedream.net
    gdelt_url: https://eoovhehfk229jrg.m.pipedream.net
    gtrends_url: https://eov9u8rngcgi2z6.m.pipedream.net
    grok_url: https://eovzc5ljf76h3h6.m.pipedream.net
- namespace: tag_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        SET METADATA = OBJECT_INSERT(
          OBJECT_INSERT(
            COALESCE(METADATA, OBJECT_CONSTRUCT()),
            'signal_kind', 'enrichment_citation', TRUE
          ),
          'linked_trend_id', '{{steps.normalize_event.$return_value.trend_id}}', TRUE
        )
        WHERE AGENT_SESSION_ID = '{{steps.run_enrichment_agent.$return_value.agent_session_id}}'
          AND '{{steps.run_enrichment_agent.$return_value.agent_session_id}}' != ''
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS
        SET METADATA = OBJECT_INSERT(
          OBJECT_INSERT(
            COALESCE(METADATA, OBJECT_CONSTRUCT()),
            'signal_kind', 'enrichment_citation', TRUE
          ),
          'linked_trend_id', '{{steps.normalize_event.$return_value.trend_id}}', TRUE
        )
        WHERE AGENT_SESSION_ID = '{{steps.run_enrichment_agent.$return_value.agent_session_id}}'
          AND '{{steps.run_enrichment_agent.$return_value.agent_session_id}}' != ''
    params: []
- namespace: run_name_reviewer
  runtime: nodejs20.x
  uses: "./run_name_reviewer/entry.js"
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    agent_output: "{{steps.run_enrichment_agent.$return_value}}"
    metrics_rows: "{{steps.q_metrics.$return_value}}"
    signal_rows: "{{steps.q_signals.$return_value}}"
    prompts_rows: "{{steps.q_prompts.$return_value}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    agent_output: "{{steps.run_enrichment_agent.$return_value}}"
    reviewer_output: "{{steps.run_name_reviewer.$return_value}}"
