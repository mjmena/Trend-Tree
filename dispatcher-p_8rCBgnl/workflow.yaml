schema: workflow/2022.04
name: Enrichment Dispatcher
settings:
  error_notification: true
  lambda_memory: 2048
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: dc_MDunJAD
- id: hi_KNH6klV
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
- namespace: claim_lock
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_ENRICHMENT_QUEUE
        SET STATUS = 'IN_PROGRESS',
            STARTED_AT = CURRENT_TIMESTAMP()
        WHERE TREND_ID = :1
          AND STATUS IN ('PENDING', 'IN_PROGRESS', 'FAILED')
      params:
      - "{{steps.normalize_event.$return_value.trend_id}}"
- namespace: orchestrate
  runtime: nodejs20.x
  uses: "./orchestrate/entry.js"
  props:
    trend_id: "{{steps.normalize_event.$return_value.trend_id}}"
    enrichment_type: "{{steps.normalize_event.$return_value.enrichment_type}}"
    trend_event: "{{steps.trigger.event}}"
- namespace: mark_failed
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      query: |-
        UPDATE MCC_RAW.MARKETING_DEV.STG_ENRICHMENT_QUEUE
        SET STATUS = 'FAILED',
            COMPLETED_AT = CURRENT_TIMESTAMP(),
            ERROR_MESSAGE = LEFT(:2, 500),
            RETRY_COUNT = COALESCE(RETRY_COUNT, 0) + 1
        WHERE TREND_ID = :1
          AND :2 IS NOT NULL
          AND :2 != ''
          AND STATUS = 'IN_PROGRESS'
      params:
      - "{{steps.normalize_event.$return_value.trend_id}}"
      - "{{steps.orchestrate.$return_value.error_message}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    orchestrate_output: "{{steps.orchestrate.$return_value}}"
