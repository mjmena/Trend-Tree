- namespace: query_signals_bulk
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH rising AS (
          SELECT v.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.V_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION IN ('NEW','GROWING')
            AND v.SUMMARY_SHORT IS NOT NULL
        ),
        filler AS (
          SELECT v.TREND_ID,
                 ROW_NUMBER() OVER (ORDER BY v.HEAT_INDEX DESC) AS FILL_RN
          FROM MCC_PRESENTATION.TREND_AGENT.V_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION NOT IN ('NEW','GROWING','SUPERSEDED')
            AND v.SUMMARY_SHORT IS NOT NULL
            AND v.TREND_ID NOT IN (SELECT TREND_ID FROM rising)
        ),
        candidates AS (
          SELECT TREND_ID FROM rising
          UNION ALL
          SELECT TREND_ID FROM filler WHERE FILL_RN <= 20
        ),
        ranked AS (
          SELECT s.TREND_ID, s.TITLE, s.URL,
                 s.SIGNAL_NAME AS SOURCE,
                 s.DOMAIN, s.PAGERANK_SCORE,
                 ROW_NUMBER() OVER (PARTITION BY s.TREND_ID ORDER BY s.PAGERANK_SCORE DESC) AS RN
          FROM MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS s
          JOIN candidates c USING (TREND_ID)
          WHERE s.PAGERANK_SCORE IS NOT NULL
            AND s.URL IS NOT NULL
        )
        SELECT TREND_ID, TITLE, URL, SOURCE, DOMAIN, PAGERANK_SCORE
        FROM ranked
        WHERE RN <= 10
        ORDER BY TREND_ID, RN
