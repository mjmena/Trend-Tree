schema: workflow/2022.04
name: Daily Digest
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 420
  network: net_5Lnie3
triggers:
- id: ti_EoTEL6N
steps:
- namespace: query_dashboard
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH rising AS (
          SELECT v.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION IN ('NEW', 'GROWING')
            AND v.SUMMARY_SHORT IS NOT NULL
        ),
        filler AS (
          SELECT v.TREND_ID,
                 ROW_NUMBER() OVER (ORDER BY v.HEAT_INDEX DESC) AS FILL_RN
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION NOT IN ('NEW', 'GROWING', 'SUPERSEDED')
            AND v.SUMMARY_SHORT IS NOT NULL
            AND v.TREND_ID NOT IN (SELECT TREND_ID FROM rising)
        ),
        selected AS (
          SELECT TREND_ID FROM rising
          UNION ALL
          SELECT TREND_ID FROM filler
          WHERE FILL_RN <= GREATEST(5 - (SELECT COUNT(*) FROM rising), 0)
        )
        SELECT v.TREND_ID,
               v.TREND_NAME,
               v.TREND_NAME_B2B,
               v.CATEGORY, v.SUBCATEGORY, v.MACROTREND_TAGS,
               v.SUMMARY_SHORT, v.HEAT_INDEX, v.VELOCITY_DIRECTION,
               v.TOTAL_CLUSTER_SIZE, v.TOP_SIGNALS,
               v.EVIDENCE,
               v.RELATED_TRENDS
        FROM selected s
        JOIN MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v USING (TREND_ID)
        ORDER BY
          CASE WHEN v.VELOCITY_DIRECTION IN ('NEW','GROWING') THEN 0 ELSE 1 END,
          v.HEAT_INDEX DESC
        LIMIT 20
      query: |-
        WITH rising AS (
          SELECT v.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION IN ('NEW', 'GROWING')
            AND v.SUMMARY_SHORT IS NOT NULL
        ),
        filler AS (
          SELECT v.TREND_ID,
                 ROW_NUMBER() OVER (ORDER BY v.HEAT_INDEX DESC) AS FILL_RN
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION NOT IN ('NEW', 'GROWING', 'SUPERSEDED')
            AND v.SUMMARY_SHORT IS NOT NULL
            AND v.TREND_ID NOT IN (SELECT TREND_ID FROM rising)
        ),
        selected AS (
          SELECT TREND_ID FROM rising
          UNION ALL
          SELECT TREND_ID FROM filler
          WHERE FILL_RN <= GREATEST(5 - (SELECT COUNT(*) FROM rising), 0)
        )
        SELECT v.TREND_ID,
               v.TREND_NAME,
               v.TREND_NAME_B2B,
               v.CATEGORY, v.SUBCATEGORY, v.MACROTREND_TAGS,
               v.SUMMARY_SHORT, v.HEAT_INDEX, v.VELOCITY_DIRECTION,
               v.TOTAL_CLUSTER_SIZE, v.TOP_SIGNALS,
               v.EVIDENCE,
               v.RELATED_TRENDS
        FROM selected s
        JOIN MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v USING (TREND_ID)
        ORDER BY
          CASE WHEN v.VELOCITY_DIRECTION IN ('NEW','GROWING') THEN 0 ELSE 1 END,
          v.HEAT_INDEX DESC
        LIMIT 20
      params: []
- namespace: check_links
  runtime: nodejs20.x
  uses: "./check_links/entry.js"
  props:
    dashboard_rows: "{{steps.query_dashboard.$return_value}}"
- namespace: verify_sources_llm
  runtime: nodejs20.x
  uses: "./verify_sources_llm/entry.js"
  props:
    google_gemini:
      authProvisionId: apn_EOhp9DY
    checked: "{{steps.check_links.$return_value}}"
- namespace: build_email
  runtime: nodejs20.x
  uses: "./build_email/entry.js"
  props:
    dashboard_rows: "{{steps.verify_sources_llm.$return_value.rows}}"
- namespace: braze_send
  runtime: nodejs20.x
  uses: "./braze_send/entry.js"
  props:
    braze:
      authProvisionId: apn_0WhgpWJ
    subject: "{{steps.build_email.$return_value.subject}}"
    html_body: "{{steps.build_email.$return_value.html_body}}"

