schema: workflow/2022.04
name: Daily Digest
settings:
  error_notification: true
  lambda_memory: 3072
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: ti_EoTEL6N
steps:
- namespace: query_dashboard
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH rising AS (
          SELECT v.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION IN ('NEW', 'GROWING', 'RESURGENT')
            AND v.SUMMARY_SHORT IS NOT NULL
        ),
        filler AS (
          SELECT v.TREND_ID,
                 ROW_NUMBER() OVER (ORDER BY v.HEAT_INDEX DESC) AS FILL_RN
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION NOT IN ('NEW', 'GROWING', 'RESURGENT', 'RETIRED')
            AND v.SUMMARY_SHORT IS NOT NULL
            AND v.TREND_ID NOT IN (SELECT TREND_ID FROM rising)
        ),
        selected AS (
          SELECT TREND_ID FROM rising
          UNION ALL
          SELECT TREND_ID FROM filler
          WHERE FILL_RN <= GREATEST(5 - (SELECT COUNT(*) FROM rising), 0)
        )
        SELECT v.TREND_ID,
               v.TREND_NAME,
               v.TREND_NAME_B2B,
               v.CATEGORY, v.SUBCATEGORY, v.MACROTREND_TAGS,
               v.SUMMARY_SHORT, v.SUMMARY_LONG,
               v.HEAT_INDEX, v.VELOCITY_DIRECTION,
               v.TOTAL_CLUSTER_SIZE, v.DISTINCT_SOURCE_COUNT,
               v.VIBE_SHIFT,
               v.SOCIAL_NARRATIVE, v.CULTURAL_DRIVERS,
               v.SEASONAL_RELEVANCE, v.GEOGRAPHIC_HOTSPOTS,
               v.KEY_DATA_POINTS,
               v.TOP_SIGNALS,
               v.EVIDENCE,
               v.RELATED_TRENDS
        FROM selected s
        JOIN MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v USING (TREND_ID)
        ORDER BY
          CASE WHEN v.VELOCITY_DIRECTION IN ('NEW','GROWING','RESURGENT') THEN 0 ELSE 1 END,
          v.HEAT_INDEX DESC
        LIMIT 20
      query: |-
        WITH rising AS (
          SELECT v.TREND_ID
          FROM MCC_PRESENTATION.TREND_AGENT.DT_TREND_DASHBOARD v
          WHERE v.VELOCITY_DIRECTION IN ('NEW', 'GROWING', 'RESURGENT')
