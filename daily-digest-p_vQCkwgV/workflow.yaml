- namespace: check_links
  runtime: nodejs20.x
  uses: "./check_links/entry.js"
  props:
    dashboard_rows: "{{steps.query_dashboard.$return_value}}"
    signal_rows: "{{steps.query_signals_bulk.$return_value}}"
- namespace: verify_sources_llm
  runtime: nodejs20.x
  uses: "./verify_sources_llm/entry.js"
  props:
    google_gemini:
      authProvisionId: apn_EOhp9DY
    checked: "{{steps.check_links.$return_value}}"
- namespace: build_email
  runtime: nodejs20.x
  uses: "./build_email/entry.js"
  props:
    dashboard_rows: "{{steps.verify_sources_llm.$return_value.rows}}"
- namespace: braze_send
  runtime: nodejs20.x
  uses: "./braze_send/entry.js"
  props:
    braze:
      authProvisionId: apn_0WhgpWJ
    subject: "{{steps.build_email.$return_value.subject}}"
    html_body: "{{steps.build_email.$return_value.html_body}}"

