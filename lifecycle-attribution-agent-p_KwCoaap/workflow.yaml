schema: workflow/2022.04
name: Lifecycle Attribution Agent
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 180
  network: net_5Lnie3
triggers:
- id: hi_xQHxdxX
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_select_active_trends
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID, NEW_STATUS AS LIFECYCLE_STATUS
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        ),
        trends_with_vector AS (
          SELECT TREND_ID
          FROM (
            SELECT TREND_ID,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
            WHERE TREND_VECTOR IS NOT NULL
          ) WHERE rn = 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC,
               COALESCE(lc.LIFECYCLE_STATUS, 'NEW') AS LIFECYCLE_STATUS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        JOIN trends_with_vector tv ON tv.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') NOT IN ('RETIRED', 'DORMANT')
        ORDER BY t.PROMOTED_AT ASC
        LIMIT {{steps.normalize_event.$return_value.sweep_cap}}
      query: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID, NEW_STATUS AS LIFECYCLE_STATUS
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        ),
        trends_with_vector AS (
          SELECT TREND_ID
          FROM (
            SELECT TREND_ID,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
            WHERE TREND_VECTOR IS NOT NULL
          ) WHERE rn = 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC,
               COALESCE(lc.LIFECYCLE_STATUS, 'NEW') AS LIFECYCLE_STATUS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        JOIN trends_with_vector tv ON tv.TREND_ID = t.TREND_ID
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') NOT IN ('RETIRED', 'DORMANT')
        ORDER BY t.PROMOTED_AT ASC
        LIMIT {{steps.normalize_event.$return_value.sweep_cap}}
    params: []
- namespace: dispatch_to_subagents
  runtime: nodejs20.x
  uses: "./dispatch_to_subagents/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    active_rows: "{{steps.q_select_active_trends.$return_value}}"
    subagent_url: https://eozqgr1dhwf0akq.m.pipedream.net
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    active_count: "{{steps.q_select_active_trends.$return_value.length}}"
    dispatch_result: "{{steps.dispatch_to_subagents.$return_value}}"
