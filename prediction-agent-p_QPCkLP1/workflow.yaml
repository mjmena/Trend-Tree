    params: []
- namespace: serialize_decisions
  runtime: nodejs20.x
  uses: "./serialize_decisions/entry.mjs"
  props:
    score_rows: "{{steps.q_score_trends.$return_value}}"
- namespace: commit_to_ledger
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_PREDICTION_APPLY(
          PARSE_JSON(:1)::ARRAY,
          '{{steps.normalize_event.$return_value.chain_id}}'
        )
      query: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_PREDICTION_APPLY(
          PARSE_JSON(:1)::ARRAY,
          '{{steps.normalize_event.$return_value.chain_id}}'
        )
      params:
      - "{{steps.serialize_decisions.$return_value.decisions_json}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.mjs"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    serialized: "{{steps.serialize_decisions.$return_value}}"
    commit_result: "{{steps.commit_to_ledger.$return_value}}"
