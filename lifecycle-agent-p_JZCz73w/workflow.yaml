schema: workflow/2022.04
name: Lifecycle Agent
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 750
  network: net_5Lnie3
triggers:
- id: dc_1gu0qyW   # lifecycle-cron-1h (timer)
- id: dc_EYugZAZ   # lifecycle-sweeper-http (manual fire)
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_select_due_trends
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID,
                 NEW_STATUS                AS LIFECYCLE_STATUS,
                 NEW_HEAT                  AS HEAT_INDEX,
                 NEW_HEAT_SMOOTHED         AS HEAT_INDEX_SMOOTHED,
                 NEXT_EVAL_AT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC,
               COALESCE(lc.LIFECYCLE_STATUS, 'NEW') AS LIFECYCLE_STATUS,
               COALESCE(lc.HEAT_INDEX_SMOOTHED, lc.HEAT_INDEX, 0) AS HEAT,
               t.PROMOTED_AT, lc.NEXT_EVAL_AT AS NEXT_LIFECYCLE_EVAL_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') != 'RETIRED'
          AND COALESCE(lc.NEXT_EVAL_AT, DATEADD(hour, 24, t.PROMOTED_AT)) <= CURRENT_TIMESTAMP()
        ORDER BY HEAT DESC NULLS LAST
        LIMIT {{steps.normalize_event.$return_value.sweep_cap}}
      query: |-
        WITH latest_lifecycle AS (
          SELECT TREND_ID,
                 NEW_STATUS                AS LIFECYCLE_STATUS,
                 NEW_HEAT                  AS HEAT_INDEX,
                 NEW_HEAT_SMOOTHED         AS HEAT_INDEX_SMOOTHED,
                 NEXT_EVAL_AT
          FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
          ) WHERE rn = 1
        )
        SELECT t.TREND_ID, t.TREND_TOPIC,
               COALESCE(lc.LIFECYCLE_STATUS, 'NEW') AS LIFECYCLE_STATUS,
               COALESCE(lc.HEAT_INDEX_SMOOTHED, lc.HEAT_INDEX, 0) AS HEAT,
               t.PROMOTED_AT, lc.NEXT_EVAL_AT AS NEXT_LIFECYCLE_EVAL_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
        LEFT JOIN latest_lifecycle lc ON lc.TREND_ID = t.TREND_ID
        WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') != 'RETIRED'
          AND COALESCE(lc.NEXT_EVAL_AT, DATEADD(hour, 24, t.PROMOTED_AT)) <= CURRENT_TIMESTAMP()
        ORDER BY HEAT DESC NULLS LAST
        LIMIT {{steps.normalize_event.$return_value.sweep_cap}}
    params: []
- namespace: q_attribute_new_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS
            (TREND_ID, SIGNAL_ID, LINK_KIND, LINK_TYPE)
        WITH trend_vectors AS (
          SELECT e.TREND_ID, e.TREND_VECTOR
          FROM (
            SELECT TREND_ID, TREND_VECTOR,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
            WHERE TREND_VECTOR IS NOT NULL
          ) e
          WHERE e.rn = 1
            AND e.TREND_ID IN (
              SELECT t.TREND_ID
              FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
              LEFT JOIN (
                SELECT TREND_ID, NEW_STATUS AS LIFECYCLE_STATUS
                FROM (
                  SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
                  FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
                ) WHERE rn = 1
              ) lc ON lc.TREND_ID = t.TREND_ID
              WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') NOT IN ('RETIRED', 'DORMANT')
            )
        ),
        new_signals AS (
          SELECT s.SIGNAL_ID, s.SIGNAL_VECTOR, s.SOURCE_NAME
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          WHERE s.EMBEDDED_AT >= DATEADD(hour, -24, CURRENT_TIMESTAMP())
            AND s.SIGNAL_VECTOR IS NOT NULL
            AND NOT EXISTS (
              SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
              WHERE x.SIGNAL_ID = s.SIGNAL_ID
            )
        ),
        raw_matches AS (
          SELECT
            tv.TREND_ID,
            ns.SIGNAL_ID,
            ns.SOURCE_NAME,
            VECTOR_COSINE_SIMILARITY(tv.TREND_VECTOR, ns.SIGNAL_VECTOR) AS SIM
          FROM trend_vectors tv
          CROSS JOIN new_signals ns
        ),
        top_matches AS (
          SELECT TREND_ID, SIGNAL_ID, SOURCE_NAME
          FROM raw_matches
          WHERE SIM >= 0.72
          QUALIFY ROW_NUMBER() OVER (PARTITION BY SIGNAL_ID ORDER BY SIM DESC) = 1
        )
        SELECT
          m.TREND_ID,
          m.SIGNAL_ID,
          'attributed' AS LINK_KIND,
          CASE m.SOURCE_NAME
            WHEN 'gdelt'                 THEN 'news'
            WHEN 'google_trends_explore' THEN 'news'
            WHEN 'google_trends_rss'     THEN 'news'
            WHEN 'bluesky'               THEN 'social'
            WHEN 'tiktok'                THEN 'social'
            WHEN 'reddit'                THEN 'social'
            WHEN 'amazon_trends'         THEN 'commerce'
            WHEN 'amazon_movers'         THEN 'commerce'
            ELSE 'other'
          END AS LINK_TYPE
        FROM top_matches m
      query: |-
        INSERT INTO MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS
            (TREND_ID, SIGNAL_ID, LINK_KIND, LINK_TYPE)
        WITH trend_vectors AS (
          SELECT e.TREND_ID, e.TREND_VECTOR
          FROM (
            SELECT TREND_ID, TREND_VECTOR,
                   ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY WRITTEN_AT DESC) AS rn
            FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_ENRICHMENT_LEDGER
            WHERE TREND_VECTOR IS NOT NULL
          ) e
          WHERE e.rn = 1
            AND e.TREND_ID IN (
              SELECT t.TREND_ID
              FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS t
              LEFT JOIN (
                SELECT TREND_ID, NEW_STATUS AS LIFECYCLE_STATUS
                FROM (
                  SELECT *, ROW_NUMBER() OVER (PARTITION BY TREND_ID ORDER BY EVALUATED_AT DESC) AS rn
                  FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_LIFECYCLE_LEDGER
                ) WHERE rn = 1
              ) lc ON lc.TREND_ID = t.TREND_ID
              WHERE COALESCE(lc.LIFECYCLE_STATUS, 'NEW') NOT IN ('RETIRED', 'DORMANT')
            )
        ),
        new_signals AS (
          SELECT s.SIGNAL_ID, s.SIGNAL_VECTOR, s.SOURCE_NAME
          FROM MCC_PRESENTATION.TREND_AGENT.FCT_SIGNALS s
          WHERE s.EMBEDDED_AT >= DATEADD(hour, -24, CURRENT_TIMESTAMP())
            AND s.SIGNAL_VECTOR IS NOT NULL
            AND NOT EXISTS (
              SELECT 1 FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SIGNALS x
              WHERE x.SIGNAL_ID = s.SIGNAL_ID
            )
        ),
        raw_matches AS (
          SELECT
            tv.TREND_ID,
            ns.SIGNAL_ID,
            ns.SOURCE_NAME,
            VECTOR_COSINE_SIMILARITY(tv.TREND_VECTOR, ns.SIGNAL_VECTOR) AS SIM
          FROM trend_vectors tv
          CROSS JOIN new_signals ns
        ),
        top_matches AS (
          SELECT TREND_ID, SIGNAL_ID, SOURCE_NAME
          FROM raw_matches
          WHERE SIM >= 0.72
          QUALIFY ROW_NUMBER() OVER (PARTITION BY SIGNAL_ID ORDER BY SIM DESC) = 1
        )
        SELECT
          m.TREND_ID,
          m.SIGNAL_ID,
          'attributed' AS LINK_KIND,
          CASE m.SOURCE_NAME
            WHEN 'gdelt'                 THEN 'news'
            WHEN 'google_trends_explore' THEN 'news'
            WHEN 'google_trends_rss'     THEN 'news'
            WHEN 'bluesky'               THEN 'social'
            WHEN 'tiktok'                THEN 'social'
            WHEN 'reddit'                THEN 'social'
            WHEN 'amazon_trends'         THEN 'commerce'
            WHEN 'amazon_movers'         THEN 'commerce'
            ELSE 'other'
          END AS LINK_TYPE
        FROM top_matches m
    params: []
- namespace: dispatch_to_subagents
  runtime: nodejs20.x
  uses: "./dispatch_to_subagents/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    due_rows: "{{steps.q_select_due_trends.$return_value}}"
    subagent_url: https://53536769d8379ab44edb7179328e9fd3.m.pipedream.net
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    due_count: "{{steps.q_select_due_trends.$return_value.length}}"
    dispatch_result: "{{steps.dispatch_to_subagents.$return_value}}"
