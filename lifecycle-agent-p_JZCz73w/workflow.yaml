schema: workflow/2022.04
name: Lifecycle Agent
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 750
  network: net_5Lnie3
triggers:
- id: dc_1gu0qyW   # lifecycle-cron-1h (timer)
- id: dc_EYugZAZ   # lifecycle-sweeper-http (manual fire)
steps:
- namespace: normalize_event
  runtime: nodejs20.x
  uses: "./normalize_event/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: q_select_due_trends
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT TREND_ID, TREND_TOPIC, LIFECYCLE_STATUS,
               COALESCE(TREND_HEAT_INDEX_SMOOTHED, TREND_HEAT_INDEX, 0) AS HEAT,
               PROMOTED_AT, NEXT_LIFECYCLE_EVAL_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS
        WHERE LIFECYCLE_STATUS != 'RETIRED'
          AND COALESCE(NEXT_LIFECYCLE_EVAL_AT, DATEADD(hour, 1, PROMOTED_AT)) <= CURRENT_TIMESTAMP()
        ORDER BY HEAT DESC NULLS LAST
        LIMIT {{steps.normalize_event.$return_value.sweep_cap}}
      query: |-
        SELECT TREND_ID, TREND_TOPIC, LIFECYCLE_STATUS,
               COALESCE(TREND_HEAT_INDEX_SMOOTHED, TREND_HEAT_INDEX, 0) AS HEAT,
               PROMOTED_AT, NEXT_LIFECYCLE_EVAL_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TRENDS
        WHERE LIFECYCLE_STATUS != 'RETIRED'
          AND COALESCE(NEXT_LIFECYCLE_EVAL_AT, DATEADD(hour, 1, PROMOTED_AT)) <= CURRENT_TIMESTAMP()
        ORDER BY HEAT DESC NULLS LAST
        LIMIT {{steps.normalize_event.$return_value.sweep_cap}}
    params: []
- namespace: dispatch_to_subagents
  runtime: nodejs20.x
  uses: "./dispatch_to_subagents/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    due_rows: "{{steps.q_select_due_trends.$return_value}}"
    subagent_url: https://53536769d8379ab44edb7179328e9fd3.m.pipedream.net
- namespace: commit_decisions
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_LIFECYCLE_APPLY(
          PARSE_JSON(:1)::ARRAY,
          '{{steps.normalize_event.$return_value.chain_id}}',
          '{{steps.normalize_event.$return_value.write_live}}'::BOOLEAN
        )
      query: |-
        CALL MCC_RAW.MARKETING_DEV.PROC_LIFECYCLE_APPLY(
          PARSE_JSON(:1)::ARRAY,
          '{{steps.normalize_event.$return_value.chain_id}}',
          '{{steps.normalize_event.$return_value.write_live}}'::BOOLEAN
        )
      params:
      - "{{steps.dispatch_to_subagents.$return_value.decisions_json}}"
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    event: "{{steps.normalize_event.$return_value}}"
    due_count: "{{steps.q_select_due_trends.$return_value.length}}"
    dispatch_result: "{{steps.dispatch_to_subagents.$return_value}}"
    commit_result: "{{steps.commit_decisions.$return_value}}"
