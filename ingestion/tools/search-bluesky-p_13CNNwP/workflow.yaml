schema: workflow/2022.04
name: Search Bluesky (agent tool)
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 60
  network: net_5Lnie3
triggers:
- id: hi_eqHned4
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: fetch_search
  runtime: nodejs20.x
  uses: "./fetch_search/entry.js"
  props:
    query: "{{steps.handle_request.$return_value.query}}"
    limit: "{{steps.handle_request.$return_value.limit}}"
    sort: "{{steps.handle_request.$return_value.sort}}"
- namespace: upsert_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    sql:
      value: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS AS target
        USING (
          SELECT
            s.value:SIGNAL_ID::STRING        AS SIGNAL_ID,
            s.value:SOURCE_NAME::STRING      AS SOURCE_NAME,
            TRY_TO_TIMESTAMP_NTZ(s.value:SIGNAL_TIMESTAMP::STRING) AS SIGNAL_TIMESTAMP,
            s.value:SIGNAL_TITLE::STRING     AS SIGNAL_TITLE,
            s.value:SIGNAL_TEXT::STRING      AS SIGNAL_TEXT,
            TRY_PARSE_JSON(s.value:METADATA::STRING) AS METADATA,
            '{{steps.handle_request.$return_value.agent_session_id}}' AS AGENT_SESSION_ID
          FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.fetch_search.$return_value.signals_json}}$$))) s
        ) AS source
        ON target.SIGNAL_ID = source.SIGNAL_ID
        WHEN MATCHED THEN UPDATE SET
          target.SIGNAL_TIMESTAMP   = source.SIGNAL_TIMESTAMP,
          target.SIGNAL_TITLE       = source.SIGNAL_TITLE,
          target.SIGNAL_TEXT        = source.SIGNAL_TEXT,
          target.METADATA           = source.METADATA,
          target.AGENT_SESSION_ID   = COALESCE(target.AGENT_SESSION_ID, source.AGENT_SESSION_ID)
        WHEN NOT MATCHED THEN INSERT (
          SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP, SIGNAL_TITLE, SIGNAL_TEXT, METADATA, AGENT_SESSION_ID
        ) VALUES (
          source.SIGNAL_ID, source.SOURCE_NAME, source.SIGNAL_TIMESTAMP,
          source.SIGNAL_TITLE, source.SIGNAL_TEXT, source.METADATA, source.AGENT_SESSION_ID
        )
      query: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.STG_EXTERNAL_SIGNALS AS target
        USING (
          SELECT
            s.value:SIGNAL_ID::STRING        AS SIGNAL_ID,
            s.value:SOURCE_NAME::STRING      AS SOURCE_NAME,
            TRY_TO_TIMESTAMP_NTZ(s.value:SIGNAL_TIMESTAMP::STRING) AS SIGNAL_TIMESTAMP,
            s.value:SIGNAL_TITLE::STRING     AS SIGNAL_TITLE,
            s.value:SIGNAL_TEXT::STRING      AS SIGNAL_TEXT,
            TRY_PARSE_JSON(s.value:METADATA::STRING) AS METADATA,
            '{{steps.handle_request.$return_value.agent_session_id}}' AS AGENT_SESSION_ID
          FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.fetch_search.$return_value.signals_json}}$$))) s
        ) AS source
        ON target.SIGNAL_ID = source.SIGNAL_ID
        WHEN MATCHED THEN UPDATE SET
          target.SIGNAL_TIMESTAMP   = source.SIGNAL_TIMESTAMP,
          target.SIGNAL_TITLE       = source.SIGNAL_TITLE,
          target.SIGNAL_TEXT        = source.SIGNAL_TEXT,
          target.METADATA           = source.METADATA,
          target.AGENT_SESSION_ID   = COALESCE(target.AGENT_SESSION_ID, source.AGENT_SESSION_ID)
        WHEN NOT MATCHED THEN INSERT (
          SIGNAL_ID, SOURCE_NAME, SIGNAL_TIMESTAMP, SIGNAL_TITLE, SIGNAL_TEXT, METADATA, AGENT_SESSION_ID
        ) VALUES (
          source.SIGNAL_ID, source.SOURCE_NAME, source.SIGNAL_TIMESTAMP,
          source.SIGNAL_TITLE, source.SIGNAL_TEXT, source.METADATA, source.AGENT_SESSION_ID
        )
      params: []
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    fetch_result: "{{steps.fetch_search.$return_value}}"
    upsert_result: "{{steps.upsert_signals.$return_value}}"

