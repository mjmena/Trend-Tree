schema: workflow/2022.04
name: Search GDELT (agent tool)
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 90
  network: net_5Lnie3
triggers:
- id: hi_mJHKgy9
steps:
- namespace: handle_request
  runtime: nodejs20.x
  uses: "./handle_request/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: fetch_search
  runtime: nodejs20.x
  uses: "./fetch_search/entry.js"
  props:
    topic: "{{steps.handle_request.$return_value.topic}}"
    window_days: "{{steps.handle_request.$return_value.window_days}}"
    mode: "{{steps.handle_request.$return_value.mode}}"
- namespace: upsert_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        CALL MCC_RAW.MARKETING_DEV.MERGE_EXTERNAL_SIGNALS(
          $${{steps.fetch_search.$return_value.signals_json}}$$,
          '{{steps.handle_request.$return_value.agent_session_id}}',
          500
        )
      query: |-
        CALL MCC_RAW.MARKETING_DEV.MERGE_EXTERNAL_SIGNALS(
          $${{steps.fetch_search.$return_value.signals_json}}$$,
          '{{steps.handle_request.$return_value.agent_session_id}}',
          500
        )
    params: []
- namespace: respond
  runtime: nodejs20.x
  uses: "./respond/entry.js"
  props:
    fetch_result: "{{steps.fetch_search.$return_value}}"
    upsert_result: "{{steps.upsert_signals.$return_value}}"

