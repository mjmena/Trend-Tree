schema: workflow/2022.04
name: LLM Enrichment
settings:
  error_notification: true
  lambda_memory: 4096
  lambda_timeout: 600
  network: net_5Lnie3
triggers:
- id: hi_vmHK662
steps:
- namespace: query_metrics
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      query: >-
        SELECT TREND_ID, TREND_TOPIC, TOTAL_CLUSTER_SIZE, DISTINCT_SOURCE_COUNT,
        VELOCITY_DIRECTION, TREND_HEAT_INDEX, DETECTED_AT, LAST_UPDATE_AT
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_METRICS
        WHERE TREND_ID = :1
      params:
      - "{{steps.trigger.event.body.trend_id}}"
- namespace: query_queue
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      query: >-
        SELECT ENRICHMENT_TYPE
        FROM MCC_RAW.MARKETING_DEV.STG_ENRICHMENT_QUEUE
        WHERE TREND_ID = :1
        ORDER BY QUEUED_AT DESC NULLS LAST
        LIMIT 1
      params:
      - "{{steps.trigger.event.body.trend_id}}"
- namespace: query_signals
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      query: >-
        SELECT TITLE, SIGNAL_NAME, DOMAIN, DETECTED_AT, PAGERANK_SCORE
        FROM MCC_PRESENTATION.TREND_AGENT.STG_TREND_SIGNALS
        WHERE TREND_ID = :1
        ORDER BY PAGERANK_SCORE DESC
        LIMIT 10
      params:
      - "{{steps.trigger.event.body.trend_id}}"
- namespace: query_sources
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      query: >-
        SELECT SOURCE_NAME, HEADLINE_METRIC, HEADLINE_METRIC_NAME, METRICS
        FROM MCC_PRESENTATION.TREND_AGENT.FCT_TREND_SOURCE_METRICS
        WHERE TREND_ID = :1
      params:
      - "{{steps.trigger.event.body.trend_id}}"
- namespace: build_llm_context
  runtime: nodejs20.x
  uses: "./build_llm_context/entry.js"
  props:
    trend_id: "{{steps.trigger.event.body.trend_id}}"
    metrics_rows: "{{steps.query_metrics.$return_value}}"
    queue_rows: "{{steps.query_queue.$return_value}}"
    signal_rows: "{{steps.query_signals.$return_value}}"
    source_rows: "{{steps.query_sources.$return_value}}"
- namespace: enrich_llm_gemini
  runtime: nodejs20.x
  uses: "./enrich_llm_gemini/entry.js"
  props:
    google_gemini:
      authProvisionId: apn_EOhp9DY
    enrich_context: "{{steps.build_llm_context.$return_value}}"
- namespace: enrich_llm_grok
  runtime: nodejs20.x
  uses: "./enrich_llm_grok/entry.js"
  props:
    x_ai:
      authProvisionId: apn_WYhE6e6
    enrich_context: "{{steps.build_llm_context.$return_value}}"
- namespace: enrich_llm_chatgpt
  runtime: nodejs20.x
  uses: "./enrich_llm_chatgpt/entry.js"
  props:
    openai:
      authProvisionId: apn_QPhO4kd
    enrich_context: "{{steps.build_llm_context.$return_value}}"
- namespace: enrich_llm_claude
  runtime: nodejs20.x
  uses: "./enrich_llm_claude/entry.js"
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    enrich_context: "{{steps.build_llm_context.$return_value}}"
    gemini_output: "{{steps.enrich_llm_gemini.$return_value}}"
    grok_output: "{{steps.enrich_llm_grok.$return_value}}"
    chatgpt_output: "{{steps.enrich_llm_chatgpt.$return_value}}"
- namespace: return_llm_output
  runtime: nodejs20.x
  uses: "./return_llm_output/entry.js"
  props:
    enrich_context: "{{steps.build_llm_context.$return_value}}"
    gemini_output: "{{steps.enrich_llm_gemini.$return_value}}"
    grok_output: "{{steps.enrich_llm_grok.$return_value}}"
    chatgpt_output: "{{steps.enrich_llm_chatgpt.$return_value}}"
    claude_output: "{{steps.enrich_llm_claude.$return_value}}"
